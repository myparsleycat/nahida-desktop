version: '3'

vars:
  APP_NAME: "nahida-desktop"
  BIN_DIR: "bin"
  # Target OS for build/package/run. Windows only. Defaults to the host OS and can be overridden with GOOS=... on the
  # task command line or the GOOS environment variable. The tasks below dispatch to the matching platform Taskfile via
  # this variable.
  GOOS: '{{.GOOS | default OS}}'

# internal/xxmi refuses to compile without nodynamic, which keeps github.com/gen2brain/avif from loading
# libavif.dll at startup. Commands that pass their own -tags, such as the application build, list it themselves.
env:
  GOFLAGS: -tags=nodynamic

includes:
  windows: ./build/windows/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    preconditions:
      - sh: '{{if eq .GOOS "windows"}}true{{else}}false{{end}}'
        msg: "This app builds for Windows only (got GOOS={{.GOOS}})."
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Packages a production build of the application
    preconditions:
      - sh: '{{if eq .GOOS "windows"}}true{{else}}false{{end}}'
        msg: "This app packages for Windows only (got GOOS={{.GOOS}})."
    cmds:
      - task: "{{.GOOS}}:package"
        vars:
          APP_VERSION: '{{.APP_VERSION}}'
          ARCH: '{{.ARCH | default "amd64"}}'

  latest-installer:
    summary: Builds the GitHub latest-installer bootstrapper
    preconditions:
      - sh: '{{if eq .GOOS "windows"}}true{{else}}false{{end}}'
        msg: "This app builds for Windows only (got GOOS={{.GOOS}})."
    cmds:
      - task: "{{.GOOS}}:latest-installer"
        vars:
          ARCH: '{{.ARCH | default "amd64"}}'

  run:
    summary: Builds and runs the application
    preconditions:
      - sh: '{{if eq .GOOS "windows"}}true{{else}}false{{end}}'
        msg: "This app runs on Windows only (got GOOS={{.GOOS}})."
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the development build and rebuilds and restarts it when sources change
    preconditions:
      - sh: '{{if eq .GOOS "windows"}}true{{else}}false{{end}}'
        msg: "This app runs on Windows only (got GOOS={{.GOOS}})."
    cmds:
      - task: "{{.GOOS}}:dev"

  test:
    summary: Runs Go tests
    desc: Runs `go test ./...` for all packages in the module.
    cmds:
      - go test ./...

  catalog:generate:
    summary: Regenerates the agent provider catalog from models.dev
    desc: Rewrites internal/agent/providers/catalog.json.
    cmds:
      - go run ./internal/agent/cataloggen

  lint:
    summary: Runs golangci-lint
    desc: |
      Runs the project-pinned golangci-lint via `go tool`.
      First run may download the binary.
    cmds:
      - go tool -modfile="./golangci-lint.mod" golangci-lint run ./...

  lint:fix:
    summary: Runs golangci-lint with autofix
    cmds:
      - go tool -modfile="./golangci-lint.mod" golangci-lint run --fix ./...

  fmt:
    summary: Formats selected Go files with gofmt, goimports, and golines
    desc: 'Pass explicit paths: task fmt -- internal/tools/model_viewer_derived_geometry.go'
    preconditions:
      - sh: '{{if .CLI_ARGS}}true{{else}}false{{end}}'
        msg: "Pass Go files or directories after --. Use task fmt:check to preview the whole repository."
    cmds:
      - go tool -modfile="./golangci-lint.mod" golangci-lint fmt --enable=gofmt,goimports,golines {{.CLI_ARGS}}

  fmt:check:
    summary: Previews Go formatting changes without writing files
    desc: 'Checks explicit paths, or the whole repository by default. Exits nonzero when formatting differs.'
    cmds:
      - go tool -modfile="./golangci-lint.mod" golangci-lint fmt --enable=gofmt,goimports,golines --diff {{.CLI_ARGS | default "./..."}}

  fmt:setup:
    summary: Builds the project-pinned formatter for VS Code
    desc: 'Run once after cloning and again after updating golangci-lint.mod or golangci-lint.sum.'
    sources:
      - golangci-lint.mod
      - golangci-lint.sum
    generates:
      - .task/bin/golangci-lint.exe
    cmds:
      - go build -modfile="./golangci-lint.mod" -o ./.task/bin/golangci-lint.exe github.com/golangci/golangci-lint/v2/cmd/golangci-lint

  vuln:
    summary: Runs govulncheck
    desc: |
      Runs the project-pinned govulncheck via `go tool`.
      First run may download the binary and vulnerability database.
    cmds:
      - go tool -modfile="./govulncheck.mod" govulncheck ./...
