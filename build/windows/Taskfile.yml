version: '3'

tasks:
  go:mod:tidy:
    summary: Runs `go mod tidy`
    internal: true
    run: once
    cmds:
      - go mod tidy

  build:
    summary: Builds the application for Windows
    cmds:
      - task: build:native
        vars:
          APP_VERSION: '{{.APP_VERSION}}'
          ARCH: '{{.ARCH | default "amd64"}}'
          DEV: '{{.DEV}}'
          EXTRA_TAGS: '{{.EXTRA_TAGS}}'
          OBFUSCATED: '{{.OBFUSCATED}}'
          GARBLE_ARGS: '{{.GARBLE_ARGS}}'

  build:native:
    summary: Builds the application using native Go compilation
    internal: true
    deps:
      - task: go:mod:tidy
    preconditions:
      - sh: '{{if eq .OBFUSCATED "true"}}command -v garble >/dev/null 2>&1{{else}}true{{end}}'
        msg: "garble is required for obfuscated builds"
    cmds:
      - task: build:elevated-helper
        vars:
          APP_VERSION: '{{.APP_VERSION}}'
          ARCH: '{{.ARCH | default "amd64"}}'
          OBFUSCATED: '{{.OBFUSCATED}}'
          GARBLE_ARGS: '{{.GARBLE_ARGS}}'
      - task: generate:syso
        vars:
          APP_VERSION: '{{.APP_VERSION}}'
          ARCH: '{{.ARCH | default "amd64"}}'
      - '{{if eq .OBFUSCATED "true"}}garble {{.GARBLE_ARGS}} build{{else}}go build{{end}} {{.BUILD_FLAGS}} -o "{{.BIN_DIR}}/{{.APP_NAME}}.exe"'
      - cmd: powershell -NoProfile -Command "Remove-Item -LiteralPath './nahida_desktop_windows_{{.ARCH | default "amd64"}}.syso' -ErrorAction SilentlyContinue"
        platforms: [windows]
    vars:
      # nodynamic keeps github.com/gen2brain/avif on its embedded decoder instead of loading libavif.dll from the DLL
      # search path at startup; internal/xxmi does not compile without it. production selects packaged mode in
      # internal/platform.
      BUILD_FLAGS: '{{if eq .DEV "true"}}-tags nodynamic{{if .EXTRA_TAGS}},{{.EXTRA_TAGS}}{{end}} -buildvcs=false -gcflags=all="-l"{{else}}-tags production,nodynamic{{if .EXTRA_TAGS}},{{.EXTRA_TAGS}}{{end}} -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui{{if .APP_VERSION}} -X nahida.live/desktop/internal/platform.AppVersion={{.APP_VERSION}}{{end}}"{{end}}'
    env:
      GOOS: windows
      CGO_ENABLED: '{{.CGO_ENABLED | default "0"}}'
      GOARCH: '{{.ARCH | default "amd64"}}'

  build:elevated-helper:
    summary: Builds the administrator-only broker used for narrow privileged operations
    internal: true
    cmds:
      - go tool go-winres make --in "{{if .APP_VERSION}}{{.BIN_DIR}}{{else}}build/windows{{end}}/elevated-helper.winres.json" --arch {{.ARCH | default "amd64"}} --no-suffix --out cmd/nahida-elevated-helper/elevated_helper_windows_{{.ARCH | default "amd64"}}.syso
      - '{{if eq .OBFUSCATED "true"}}garble {{.GARBLE_ARGS}} build{{else}}go build{{end}} -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui" -o "internal/elevated/bundle/nahida-elevated-helper.exe" ./cmd/nahida-elevated-helper'
      - cmd: powershell -NoProfile -Command "Remove-Item -LiteralPath './cmd/nahida-elevated-helper/elevated_helper_windows_{{.ARCH | default "amd64"}}.syso' -ErrorAction SilentlyContinue"
        platforms: [windows]
    env:
      GOOS: windows
      CGO_ENABLED: '{{.CGO_ENABLED | default "0"}}'
      GOARCH: '{{.ARCH | default "amd64"}}'

  package:
    summary: Creates the Windows amd64 release assets
    preconditions:
      - sh: 'test -n "{{.APP_VERSION}}"'
        msg: "APP_VERSION is required (for example: task package APP_VERSION=3.0.0-beta.1)"
      - sh: 'test "{{.ARCH | default "amd64"}}" = "amd64"'
        msg: "Only Windows amd64 release packages are supported."
    cmds:
      - task: prepare:release
        vars:
          APP_VERSION: '{{.APP_VERSION}}'
      - task: create:nsis:installer
        vars:
          APP_VERSION: '{{.APP_VERSION}}'
          ARCH: amd64
      - powershell -NoProfile -File scripts/verify-release-binary.ps1 "{{.BIN_DIR}}/{{.APP_NAME}}.exe" "{{.APP_VERSION}}"
      - task: publish:updater
        vars:
          ARCH: amd64

  prepare:release:
    summary: Validates APP_VERSION and writes the versioned go-winres configs and NSIS include
    internal: true
    cmds:
      - node scripts/write-release-metadata.mjs "{{.APP_VERSION}}" "{{.BIN_DIR}}"

  publish:updater:
    summary: Writes the updater executable and SHA256SUMS using the release asset contract
    cmds:
      - cmd: powershell -NoProfile -File build/windows/publish-updater.ps1 "{{.BIN_DIR}}" "{{.APP_NAME}}" "{{.ARCH | default "amd64"}}"
        platforms: [windows]

  generate:syso:
    summary: Generates the application icon, manifest, and version resource
    desc: Release builds read the versioned config that prepare:release writes to the bin directory.
    cmds:
      - go tool go-winres make --in "{{if .APP_VERSION}}{{.BIN_DIR}}{{else}}build/windows{{end}}/nahida-desktop.winres.json" --arch {{.ARCH | default "amd64"}} --no-suffix --out nahida_desktop_windows_{{.ARCH | default "amd64"}}.syso

  latest-installer:
    summary: Builds the GitHub latest-installer bootstrapper
    preconditions:
      - sh: 'test "{{.ARCH | default "amd64"}}" = "amd64"'
        msg: "Only Windows amd64 latest-installer builds are supported."
    cmds:
      - go tool go-winres make --in build/windows/latest-installer.winres.json --arch {{.ARCH | default "amd64"}} --no-suffix --out tools/latest-installer/latest_installer_windows_{{.ARCH | default "amd64"}}.syso
      - go build -trimpath -ldflags="-H windowsgui -s -w" -o "{{.BIN_DIR}}/Nahida Desktop Latest Installer.exe" ./tools/latest-installer
      - cmd: powershell -NoProfile -Command "Remove-Item -LiteralPath './tools/latest-installer/latest_installer_windows_{{.ARCH | default "amd64"}}.syso' -ErrorAction SilentlyContinue"
        platforms: [windows]
    env:
      GOOS: windows
      CGO_ENABLED: "0"
      GOARCH: '{{.ARCH | default "amd64"}}'

  create:nsis:installer:
    summary: Creates the unsigned per-user NSIS installer
    dir: build/windows/nsis
    deps:
      - task: build
        vars:
          APP_VERSION: '{{.APP_VERSION}}'
          ARCH: '{{.ARCH | default "amd64"}}'
    preconditions:
      - sh: 'test "{{.ARCH | default "amd64"}}" = "amd64"'
        msg: "Only Windows amd64 installers are supported."
    cmds:
      - node "{{.ROOT_DIR}}/scripts/prepare-webview2.mjs" "{{.ROOT_DIR}}/{{.BIN_DIR}}/MicrosoftEdgeWebview2Setup.exe"
      - |
        {{if eq OS "windows"}}
        '{{.MAKENSIS}}' -DAPP_BINARY="{{.ROOT_DIR}}\{{.BIN_DIR}}\{{.APP_NAME}}.exe" -DWEBVIEW2_BOOTSTRAPPER="{{.ROOT_DIR}}\{{.BIN_DIR}}\MicrosoftEdgeWebview2Setup.exe" project.nsi
        {{else}}
        '{{.MAKENSIS}}' -DAPP_BINARY="{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}.exe" -DWEBVIEW2_BOOTSTRAPPER="{{.ROOT_DIR}}/{{.BIN_DIR}}/MicrosoftEdgeWebview2Setup.exe" project.nsi
        {{end}}
    vars:
      MAKENSIS: '{{.MAKENSIS | default (ternary "C:/Program Files (x86)/NSIS/makensis.exe" "makensis" (eq OS "windows"))}}'

  run:
    cmds:
      - task: build
      - '{{.BIN_DIR}}/{{.APP_NAME}}.exe'
