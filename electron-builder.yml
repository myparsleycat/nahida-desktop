appId: com.nahida.app
productName: Nahida Desktop
directories:
    buildResources: build
files:
    - "!**/.*"
    - "!**/.*/**/*"
    - "!src/**/*"
    - "!electron.vite.config.{js,ts,mjs,cjs}"
    - "!{eslint.config.mjs,dev-app-update.yml,CHANGELOG.md,README.md}"
    - "!{pnpm-lock.yaml}"
    - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
    - "!native/**/*"
    - "!plugins/**/*"
    - "!local.db*"
    - "!tools/**/*"
    - "!docs/**/*"
    - "!plans/**/*"
    - "!{AGENTS.md,components.json,vitest.config.ts,wrangler.jsonc,pnpm-workspace.yaml,release_note.md}"
    - "!**/*.{map,d.ts,d.mts,d.cts}"
    - "!**/{test,tests,__tests__,docs,example,examples,benchmark,benchmarks}/**/*"
    - "!**/applescript/**/*"
    # Keep only win32-x64 optional native bindings (hoisted + pnpm store layouts)
    - "!**/@img/sharp-*darwin*/**/*"
    - "!**/@img/sharp-*linux*/**/*"
    - "!**/@img/sharp-*freebsd*/**/*"
    - "!**/@img/sharp-*wasm*/**/*"
    - "!**/@img/sharp-*webcontainers*/**/*"
    - "!**/@img/sharp-win32-arm64/**/*"
    - "!**/@img/sharp-win32-ia32/**/*"
    - "!**/@napi-rs/*-android*/**/*"
    - "!**/@napi-rs/*-darwin*/**/*"
    - "!**/@napi-rs/*-linux*/**/*"
    - "!**/@napi-rs/*-freebsd*/**/*"
    - "!**/@napi-rs/*-openharmony*/**/*"
    - "!**/@napi-rs/*-wasm*/**/*"
    - "!**/@napi-rs/*-win32-arm64*/**/*"
    - "!**/@napi-rs/*-win32-ia32*/**/*"
    - "!**/@cbor-extract/cbor-extract-darwin*/**/*"
    - "!**/@cbor-extract/cbor-extract-linux*/**/*"
    - "!node_modules/.pnpm/@img+sharp-*darwin*/**/*"
    - "!node_modules/.pnpm/@img+sharp-*linux*/**/*"
    - "!node_modules/.pnpm/@img+sharp-*freebsd*/**/*"
    - "!node_modules/.pnpm/@img+sharp-*wasm*/**/*"
    - "!node_modules/.pnpm/@img+sharp-*webcontainers*/**/*"
    - "!node_modules/.pnpm/@img+sharp-win32-arm64@*/**/*"
    - "!node_modules/.pnpm/@img+sharp-win32-ia32@*/**/*"
    - "!node_modules/.pnpm/@napi-rs+*-android*/**/*"
    - "!node_modules/.pnpm/@napi-rs+*-darwin*/**/*"
    - "!node_modules/.pnpm/@napi-rs+*-linux*/**/*"
    - "!node_modules/.pnpm/@napi-rs+*-freebsd*/**/*"
    - "!node_modules/.pnpm/@napi-rs+*-openharmony*/**/*"
    - "!node_modules/.pnpm/@napi-rs+*-wasm*/**/*"
    - "!node_modules/.pnpm/@napi-rs+*-win32-arm64*/**/*"
    - "!node_modules/.pnpm/@napi-rs+*-win32-ia32*/**/*"
    - "!node_modules/.pnpm/@cbor-extract+cbor-extract-darwin*/**/*"
    - "!node_modules/.pnpm/@cbor-extract+cbor-extract-linux*/**/*"
# asar: false
asarUnpack:
    - resources/**
    - "**/*.node"
    - "node_modules/sharp"
    - "node_modules/@img"
win:
    # cscLink: nahida-desktop.pfx
    # cscKeyPassword: password
    executableName: Nahida Desktop
    extraResources:
        - from: "native/dll-injector/target/release"
          filter:
              - dll-injector.exe
nsis:
    artifactName: Nahida-Desktop-Setup-${version}.${ext}
    shortcutName: ${productName}
    uninstallDisplayName: ${productName}
    createDesktopShortcut: true
    include: build/installer.nsh
    deleteAppDataOnUninstall: true
npmRebuild: false
publish:
    provider: github
    owner: myparsleycat
    repo: nahida-desktop
