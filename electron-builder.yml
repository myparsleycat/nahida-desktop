appId: com.nahida.app
productName: Nahida Desktop
directories:
    buildResources: build
files:
    - "!**/.vscode/*"
    - "!src/*"
    - "!electron.vite.config.{js,ts,mjs,cjs}"
    - "!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
    - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
    - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
    - "!node_modules/.pnpm/@cbor-extract+cbor-extract-darwin-arm64@*/**/*"
    - "!node_modules/.pnpm/@cbor-extract+cbor-extract-darwin-x64@*/**/*"
    - "!node_modules/.pnpm/@cbor-extract+cbor-extract-linux-arm@*/**/*"
    - "!node_modules/.pnpm/@cbor-extract+cbor-extract-linux-arm64@*/**/*"
    - "!node_modules/.pnpm/@cbor-extract+cbor-extract-linux-x64@*/**/*"
# asar: false
extraResources:
    - from: build/extractor
      to: lib
      filter:
          - extractor.dll
    - from: build/ini-parser/build/Release
      to: lib
      filter:
          - ini_parser.dll
    - from: build/watchman-v2025.02.24.00-windows
    - from: build/compact
      to: lib
      filter:
          - compact.exe
asarUnpack:
    - resources/**
win:
    executableName: Nahida Desktop
nsis:
    artifactName: Nahida Desktop Setup ${version}.${ext}
    shortcutName: ${productName}
    uninstallDisplayName: ${productName}
    createDesktopShortcut: true
    include: build/installer.nsh
mac:
    entitlementsInherit: build/entitlements.mac.plist
    extendInfo:
        - NSCameraUsageDescription: Application requests access to the device's camera.
        - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
        - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
        - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
    notarize: false
dmg:
    artifactName: ${productName}.${ext}
linux:
    target:
        - AppImage
        - snap
        - deb
    maintainer: electronjs.org
    category: Utility
appImage:
    artifactName: ${productName}.${ext}
npmRebuild: false
publish:
    provider: github
    owner: myparsleycat
    repo: nahida-desktop
