appId: com.nahida.app
productName: Nahida Desktop
afterSign: scripts/after-sign-mac.js
directories:
    buildResources: build
files:
    - "!**/.*"
    - "!**/.*/**/*"
    - "!src/**/*"
    - "!electron.vite.config.{js,ts,mjs,cjs}"
    - "!{eslint.config.mjs,dev-app-update.yml,CHANGELOG.md,README.md}"
    - "!{pnpm-lock.yaml}"
    - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
    - "!node_modules/.pnpm/@cbor-extract+cbor-extract-linux-arm@*/**/*"
    - "!node_modules/.pnpm/@cbor-extract+cbor-extract-linux-arm64@*/**/*"
    - "!node_modules/.pnpm/@cbor-extract+cbor-extract-linux-x64@*/**/*"
    - "!native/**/*"
    - "!plugins/**/*"
    - "!local.db"
    - "!tools/**/*"
# asar: false
asarUnpack:
    - resources/**
    - "**/*.node"
    - "node_modules/sharp"
    - "node_modules/@img"
win:
    # cscLink: nahida-desktop.pfx
    # cscKeyPassword: password
    executableName: Nahida Desktop
    extraResources:
        - from: "native/dll-injector/target/release"
          filter:
              - dll-injector.exe
nsis:
    artifactName: Nahida Desktop Setup ${version}.${ext}
    shortcutName: ${productName}
    uninstallDisplayName: ${productName}
    createDesktopShortcut: true
    include: build/installer.nsh
    deleteAppDataOnUninstall: true
mac:
    identity: null
    entitlementsInherit: build/entitlements.mac.plist
    extendInfo:
        - NSCameraUsageDescription: Application requests access to the device's camera.
        - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
        - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
        - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
    notarize: false
dmg:
    artifactName: ${productName}.${ext}
linux:
    target:
        - AppImage
        - snap
        - deb
    maintainer: electronjs.org
    category: Utility
appImage:
    artifactName: ${productName}.${ext}
npmRebuild: false
publish:
    provider: github
    owner: myparsleycat
    repo: nahida-desktop
