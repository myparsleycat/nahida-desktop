name: PR Agent

on:
  pull_request:
    types: [opened]

jobs:
  pr-agent:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Generate PR summary
        uses: the-pr-agent/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          DEEPSEEK.KEY: ${{ secrets.DEEPSEEK_API_KEY }}

          config.model: "deepseek/deepseek-v4-flash"
          config.fallback_models: '["deepseek/deepseek-v4-flash"]'

          github_action_config.auto_describe: "true"
          github_action_config.auto_review: "false"
          github_action_config.auto_improve: "false"

          github_action_config.pr_actions: '["opened"]'

          pr_description.publish_description_as_comment: "true"
          pr_description.publish_description_as_comment_persistent: "true"

          pr_description.generate_ai_title: "false"

          pr_description.enable_pr_diagram: "true"

          pr_description.extra_instructions: >
            Write the pull request summary in Korean.
            Summarize the purpose of the pull request based on the code changes.
            Clearly explain the main changes and important implementation details.
            Focus on information that is useful to reviewers.
            Keep the summary concise.
