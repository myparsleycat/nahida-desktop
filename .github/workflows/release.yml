name: Release desktop

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Calculate the next release without creating a tag or draft
        type: boolean
        required: true
        default: true

concurrency:
  group: nahida-desktop-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Validate and release
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Require the main or v3 branch
        shell: pwsh
        run: |
          if ('${{ github.ref }}' -notin @('refs/heads/main', 'refs/heads/v3')) {
            throw "Desktop releases may only run from main or v3; got '${{ github.ref }}'."
          }

      - name: Check out complete history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            frontend/pnpm-lock.yaml

      - name: Install pinned Task
        shell: pwsh
        run: go install github.com/go-task/task/v3/cmd/task@v3.53.1

      - name: Install pinned NSIS
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        run: choco install nsis --version=3.11 --yes --no-progress

      - name: Install release dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Install frontend dependencies
        shell: pwsh
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Validate desktop
        uses: ./.github/actions/validate-desktop

      - name: Calculate next release
        if: inputs.dry_run
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release --dry-run

      - name: Create release tag and draft
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release

      - name: Verify packaged release binary
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath bin/release-version.nsh | Select-String 'NAHIDA_SEMVER').Line.Split('"')[1]
          ./scripts/verify-release-binary.ps1 -Executable bin/nahida-desktop-windows-amd64.exe -AppVersion $version
