name: Release desktop

on:
  workflow_dispatch:

concurrency:
  group: nahida-desktop-release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Validate and release
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Require the main or v3 branch
        shell: pwsh
        run: |
          if ('${{ github.ref }}' -notin @('refs/heads/main', 'refs/heads/v3')) {
            throw "Desktop releases may only run from main or v3; got '${{ github.ref }}'."
          }

      # Hosted Windows runners keep TEMP and the Go caches on C:, which is much slower than the workspace drive for
      # the many small files that tests, builds, and the Go cache restore write. Must run before Set up Go so the
      # cache is saved and restored at these paths.
      - name: Keep temporary files and Go caches on the workspace drive
        shell: pwsh
        run: |
          $goCache = Join-Path (Split-Path -Qualifier $env:GITHUB_WORKSPACE) 'go-cache'
          @(
            "TEMP=$env:RUNNER_TEMP"
            "TMP=$env:RUNNER_TEMP"
            "GOCACHE=$(Join-Path $goCache 'build')"
            "GOMODCACHE=$(Join-Path $goCache 'mod')"
          ) | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8

      - name: Check out complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install pinned Task
        shell: pwsh
        run: go install github.com/go-task/task/v3/cmd/task@v3.53.1

      - name: Install pinned NSIS
        shell: pwsh
        run: choco install nsis --version=3.11 --yes --no-progress

      - name: Install release dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Validate desktop
        uses: ./.github/actions/validate-desktop

      - name: Determine next release version
        id: plan-release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/plan-release.mjs

      - name: Package desktop release
        if: steps.plan-release.outputs.version != ''
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.plan-release.outputs.version }}
        run: pnpm run release:prepare -- $env:RELEASE_VERSION

      - name: Verify packaged release binary
        if: steps.plan-release.outputs.version != ''
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.plan-release.outputs.version }}
        run: ./scripts/verify-release-binary.ps1 -Executable bin/nahida-desktop-windows-amd64.exe -AppVersion $env:RELEASE_VERSION

      # Attesting the version string binds the executables to this release, so an older attested build cannot be
      # republished under a newer tag.
      - name: Write attested release version
        if: steps.plan-release.outputs.version != ''
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.plan-release.outputs.version }}
        run: Set-Content -LiteralPath bin/nahida-desktop-release-version -Value $env:RELEASE_VERSION -NoNewline -Encoding ascii

      - name: Attest release executables
        id: attest-release
        if: steps.plan-release.outputs.version != ''
        uses: actions/attest@v4
        with:
          subject-path: |
            bin/nahida-desktop-windows-amd64.exe
            bin/nahida-desktop-windows-amd64-installer.exe
            bin/nahida-desktop-release-version

      # The self-updater installs only builds whose digest this bundle attests.
      - name: Stage attestation bundle
        if: steps.plan-release.outputs.version != ''
        shell: pwsh
        env:
          BUNDLE_PATH: ${{ steps.attest-release.outputs.bundle-path }}
        run: Copy-Item -LiteralPath $env:BUNDLE_PATH -Destination bin/nahida-desktop-windows-amd64.sigstore.json

      - name: Create release tag and draft
        if: steps.plan-release.outputs.version != ''
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ATTESTED_RELEASE_VERSION: ${{ steps.attest-release.outputs.attestation-id && steps.plan-release.outputs.version }}
        run: pnpm exec semantic-release
