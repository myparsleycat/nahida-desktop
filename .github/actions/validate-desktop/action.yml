name: Validate desktop
description: Runs the Go, frontend, generated-binding, and release-script gates

runs:
  using: composite
  steps:
    - name: Verify Go modules are tidy
      shell: pwsh
      run: |
        go mod tidy
        git diff --exit-code -- go.mod go.sum

    # Runs first because it generates the Wails bindings and frontend/dist that the Go and frontend gates below
    # need; generating them separately would repeat both.
    - name: Build Windows application
      shell: pwsh
      run: task build ARCH=amd64

    - name: Test Go backend
      shell: pwsh
      run: go test ./...

    - name: Lint Go backend
      shell: pwsh
      run: task lint

    - name: Test release version mapping
      shell: pwsh
      run: pnpm test

    - name: Lint and type-check frontend
      shell: pwsh
      working-directory: frontend
      run: |
        pnpm lint
        pnpm typecheck

    - name: Test frontend
      shell: pwsh
      working-directory: frontend
      run: pnpm test
