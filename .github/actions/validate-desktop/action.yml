name: Validate desktop
description: Runs the Go build, test, and lint gates and the release-script tests

runs:
  using: composite
  steps:
    - name: Verify Go modules are tidy
      shell: pwsh
      run: |
        go mod tidy
        git diff --exit-code -- go.mod go.sum

    - name: Build Windows application
      shell: pwsh
      run: task build ARCH=amd64

    - name: Test Go backend
      shell: pwsh
      run: go test -tags nodynamic ./...

    - name: Lint Go backend
      shell: pwsh
      run: task lint

    - name: Test release scripts
      shell: pwsh
      run: pnpm test
