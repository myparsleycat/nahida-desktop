name: Validate desktop
description: Runs the Go, frontend, generated-binding, and release-script gates

runs:
  using: composite
  steps:
    - name: Verify Go modules are tidy
      shell: pwsh
      run: |
        go mod tidy
        git diff --exit-code -- go.mod go.sum

    - name: Build frontend for Go embedding
      shell: pwsh
      working-directory: frontend
      run: pnpm build

    - name: Test Go backend
      shell: pwsh
      run: go test ./...

    - name: Lint Go backend
      shell: pwsh
      run: task lint

    - name: Test release version mapping
      shell: pwsh
      run: pnpm test

    - name: Regenerate and verify Wails bindings
      shell: pwsh
      run: |
        task common:generate:bindings
        pnpm --dir frontend exec oxfmt bindings
        git diff --exit-code -- frontend/bindings go.mod go.sum

    - name: Check frontend formatting
      shell: pwsh
      working-directory: frontend
      run: pnpm fmt:check

    - name: Lint and type-check frontend
      shell: pwsh
      working-directory: frontend
      run: |
        pnpm lint
        pnpm typecheck

    - name: Test frontend
      shell: pwsh
      working-directory: frontend
      run: pnpm test

    - name: Build Windows application
      shell: pwsh
      run: task build ARCH=amd64
