name: Validate desktop
description: Runs the Go build, test, and lint gates and the release-script tests

runs:
  using: composite
  steps:
    - name: Verify Go modules are tidy
      shell: pwsh
      run: |
        go mod tidy
        git diff --exit-code -- go.mod go.sum

    - name: Build Windows application
      shell: pwsh
      run: task build ARCH=amd64

    - name: Test Go backend
      shell: pwsh
      run: go test -tags nodynamic ./...

    - name: Test embedded native kernels
      shell: pwsh
      run: go test -tags nodynamic,native_kernels ./internal/nativecompute ./internal/tools/model_viewer -run '^Test(BundledLibrary|PackedSkinning)'

    - name: Test packed skinning fallback with AVX disabled
      shell: pwsh
      env:
        GODEBUG: cpu.avx=off
      run: go test -tags nodynamic,native_kernels ./internal/nativecompute ./internal/tools/model_viewer -run '^Test(BundledLibrary|PackedSkinning)'

    - name: Lint Go backend
      shell: pwsh
      run: task lint

    - name: Test release scripts
      shell: pwsh
      run: pnpm test
