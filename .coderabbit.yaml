# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: en-US
early_access: false

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  changed_files_summary: true
  sequence_diagrams: true
  poem: false
  review_status: true
  collapse_walkthrough: false

  auto_review:
    enabled: true
    drafts: false
    ignore_title_keywords:
      - WIP
      - DO NOT MERGE

  pre_merge_checks:
    description:
      mode: warning
    docstrings:
      mode: "off"

  tools:
    golangci-lint:
      enabled: true
      config_file: ".golangci.yml"
    oxc:
      enabled: true
    actionlint:
      enabled: true
    psscriptanalyzer:
      enabled: true

  path_filters:
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!**/out/**"
    - "!**/coverage/**"
    - "!**/.pnpm-store/**"
    - "!**/.tanstack/**"
    - "!**/.task/**"
    - "!**/.gocache/**"
    - "!**/.gomodcache/**"
    - "!bin/**"
    - "!frontend/bindings/**"
    - "!frontend/src/routeTree.gen.ts"
    - "!**/*.gen.ts"
    - "!**/*.lock"
    - "!**/pnpm-lock.yaml"
    - "!**/*.db*"
    - "!**/*.{png,gif,ico,ttf,woff2,zst,zip,7z,exe,dll,node}"

  path_instructions:
    - path: "**/*"
      instructions: |
        Prioritize actionable issues with a concrete impact on correctness, security, data integrity, reliability, performance, or maintainability.
        Do not comment on formatting, naming preferences, subjective style, minor simplifications, harmless redundancy, or other nitpicks.
        Avoid feedback already enforced by gofmt, golangci-lint, oxfmt, or oxlint. Only raise a maintainability concern when it creates meaningful risk or makes the changed code substantially harder to understand or modify.
        This is a Windows-only Wails v3 desktop application with a Go backend and a React/TypeScript frontend. Do not suggest Electron APIs or restoring Linux, macOS, Android, or iOS support.
        Preserve the existing UI, UX, state management, and package ownership unless a change explicitly requires otherwise.

    - path: "**/*.go"
      instructions: |
        Go backend review priorities:
        - Check context propagation and cancellation, goroutine ownership, synchronization, resource closure, partial-failure cleanup, rollback, and error propagation.
        - Treat all paths, URLs, archive entries, process arguments, network responses, persisted values, and Wails-bound method inputs as untrusted. Check path traversal, archive extraction, command injection, SSRF, unsafe redirects, and filesystem atomicity where relevant.
        - For Wails-backed user actions whose renderer fallback hides the original failure, require the backend error to be logged first with service/action, operation stage, domain identifiers, relevant resolved paths or URLs, and cleanup or rollback state.
        - Flag secrets, tokens, or sensitive user data written to logs.
        - Check SQL and filesystem consistency, HTTP response-body ownership, bounded concurrency, integer and buffer bounds, and Windows-specific path behavior.
        - Prefer the standard library when equally clear and github.com/samber/lo for straightforward collection transformations; do not force functional helpers into branching or performance-sensitive control flow.
        - Keep exported APIs minimal. Exported Wails service methods and bound models become frontend contracts and require compatibility checks.

    - path: "internal/app/**/*.go"
      instructions: |
        Review Wails v3 application wiring and lifecycle carefully:
        - Use the current Wails v3 API and the fork/version pinned by go.mod; do not recommend Wails v2 APIs.
        - Check service construction and registration, startup ordering, dependency wiring, window lifecycle, event emission, shutdown ordering, and cleanup after partially completed startup.
        - A change to an exported bound service method, parameter, return type, or model must remain compatible with generated frontend bindings and all @bindings callers. Bindings are generated; never suggest editing frontend/bindings manually.
        - Verify Go event names and payloads agree with frontend listeners, and that events are not emitted through an unavailable application/window lifecycle state.
        - Check multi-window behavior, protocol/local HTTP boundaries, WebView cookie handling, deep links, and Windows startup/background behavior for authorization and lifecycle mistakes.

    - path: "internal/platform/**/*.go"
      instructions: |
        Review Windows integration for correct build constraints, UTF-16/path handling, handle and COM/resource lifetimes, thread-affinity requirements, process quoting, registry/autostart behavior, and native error propagation.
        Do not request non-Windows implementations or generic cross-platform abstractions for Windows-only behavior.

    - path: "internal/infra/**/*.go"
      instructions: |
        Treat this package as shared infrastructure and a security boundary:
        - Check HTTP client and response-body ownership, redirects, proxy/PAC behavior, retry and Retry-After bounds, local HTTP/protocol authorization, archive extraction, update integrity, and rate-limit handling.
        - Preserve diagnostic error causes and severity while redacting credentials, cookies, tokens, home-directory paths, and response bodies that may contain sensitive data.
        - Check lifecycle ownership for background diagnostics, throttling, downloads, listeners, temporary files, and partially initialized services. Cancellation and shutdown must not leak goroutines or block application exit.
        - ContractError values intentionally preserve legacy user-facing text; do not suggest normalizing their capitalization or punctuation without checking callers.

    - path: "internal/db/**/*.go"
      instructions: |
        Review SQLite schema reconciliation and stores as persistent-data compatibility code. Check transactions, foreign keys, indexes, NULL/default handling, identifier quoting, row and statement closure, context propagation, and concurrent access.
        Schema changes must preserve existing user data, aliases, and upgrade paths. Require migration/reconciliation tests for old or malformed schemas and do not assume a fresh database.

    - path: "internal/{drive,transfer}/**/*.go"
      instructions: |
        Review uploads, downloads, remote imports, SSE streams, queues, bandwidth limiting, progress emission, and cancellation as one cross-package lifecycle.
        Check bounded memory and concurrency, HTTP/body closure, short reads and writes, integer overflow, path and filename validation, partial-file cleanup, rollback, retry safety, terminal-status ordering, and exactly-once cancellation/cleanup.
        Authentication tokens, signatures, link credentials, and remote response bodies must not leak into logs or user-visible diagnostics.

    - path: "internal/{mod,watcher,xxmi}/**/*.go"
      instructions: |
        These packages mutate user mod trees and coordinate external game/importer processes. Check canonical and relative path validation, junction/reparse-point behavior, watcher races, process discovery and quoting, file identity, atomic replacement, cancellation, rollback, and recovery after interruption.
        Compression, merge, disable/enable, and restore operations must never lose the only copy of user data. Verify cleanup and rollback errors remain observable and that concurrent operations cannot target the same files unsafely.

    - path: "internal/{menumaker,pepad,tools}/**/*.go"
      instructions: |
        Treat INI, PE, DDS, mesh, archive, and rule inputs as untrusted binary or text formats. Check offsets, lengths, alignment, integer conversions, allocation limits, decompression limits, path traversal, deterministic output, and preservation of unknown-but-valid data.
        Multi-file generators and fixers need source-change detection, atomic writes, explicit cleanup, and rollback that reports both the primary and rollback failures.

    - path: "frontend/src/**/*.{ts,tsx}"
      instructions: |
        React and renderer review priorities:
        - Check hook dependencies, stale closures, cleanup of listeners and timers, accessibility, loading/error/empty states, and user-visible text localization.
        - Keep React state for values that affect rendered UI. For high-frequency visual-only updates, prefer refs and imperative methods to avoid expensive component and Three.js rerenders.
        - Flag unsafe HTML, untrusted external URLs, unsafe local-file handling, and assumptions that renderer input or backend output is trusted.
        - Backend calls must use generated imports through the @bindings alias. Do not suggest hand-written copies of generated services or models.
        - For @wailsio/runtime events, check exact event names and payload shapes, deterministic subscription cleanup, duplicate listeners, and behavior across remounts or window reloads.
        - Preserve TanStack Router, Zustand, React Query, and existing Wails adapter boundaries unless the change requires an architectural change.

    - path: "frontend/src/wails/**/*.{ts,tsx}"
      instructions: |
        Treat this directory as the renderer-side Wails boundary. Keep adapters narrow and typed, preserve unavailable-runtime behavior used by tests or browser contexts, and check event/listener teardown, file-drop validation, window identity, and backend error propagation.
        Do not introduce Electron contextBridge, ipcRenderer, preload, or channel abstractions.

    - path: "frontend/src/port/**/*.{ts,tsx}"
      instructions: |
        Review bootstrap and port abstractions for correct Wails availability detection, initialization order, listener cleanup, and behavior when native capabilities are unavailable. Keep backend-specific details behind the existing boundary.

    - path: "frontend/src/components/tools/{body-shape,model-viewer}/**/*.{ts,tsx}"
      instructions: |
        Review Three.js and worker-heavy rendering for transferred-buffer ownership, message generation/request ordering, stale responses, worker termination, object URL and GPU resource disposal, render-loop cleanup, and bounded CPU/GPU memory.
        Validate binary lengths, strides, indices, frame ranges, numeric finiteness, and malformed model inputs before allocating or mutating geometry. Preserve the localized imperative update paths used for high-frequency visual feedback; do not request broad React state updates that rerender the scene.

    - path: "frontend/src/shared/{body-shape,mod-viewer}/**/*.{ts,tsx}"
      instructions: |
        Treat parsers, geometry transforms, animation evaluation, and transport models as binary-data boundaries. Check bounds and overflow before typed-array access or allocation, preserve buffer ownership, and verify format-specific coordinate, stride, topology, and animation invariants with focused tests.

    - path: "frontend/src/{components/tools/menu-maker,shared/menu-maker}/**/*.{ts,tsx}"
      instructions: |
        Review menu-maker parsing, draft state, media handling, and generation for untrusted input validation, object URL cleanup, deterministic output, source-hash conflict detection, and consistency with the backend apply/rollback contract.

    - path: "**/*.{ts,tsx,mts,cts,mjs,cjs,js,jsx}"
      instructions: |
        Focus on bugs and material risks involving type safety, resource cleanup, concurrency, cancellation, error propagation, and boundary validation.
        Do not report style-only deviations such as destructuring choices, loop versus array-method preferences, variable inlining, helper extraction, or equivalent utility choices unless they cause a concrete defect or significant maintenance risk.

    - path: "frontend/patches/**/*.patch"
      instructions: |
        These patches intentionally modify the pinned Wails runtime dependency. Check that each patch still applies to the exact frontend package version, remains narrowly scoped, preserves upstream behavior outside the documented fix, and stays synchronized with package.json and pnpm lockfile changes.

    - path: "**/*_test.go"
      instructions: |
        Check observable behavior, failure paths, cancellation, cleanup, concurrency, Windows path edge cases, and regressions in Wails service contracts. Tests must be deterministic and must not leak goroutines, handles, listeners, temporary files, or global state.

    - path: "**/*.{test,spec}.{ts,tsx}"
      instructions: |
        Check that tests cover observable behavior, Wails-unavailable fallbacks, event unsubscribe behavior, failure paths, boundary cases, cleanup, and regressions. Avoid assertions coupled to implementation details or timing-sensitive tests without deterministic synchronization.

    - path: "go.mod"
      instructions: |
        Preserve the Wails v3 fork mapping from github.com/wailsapp/wails/v3 to github.com/myparsleycat/wails/v3 and keep generators pinned with Go's tool directive. Check dependency changes for version compatibility, necessity, licensing/security risk, and corresponding go.sum updates.

    - path: "**/package.json"
      instructions: |
        Check dependency and script changes against the matching pnpm workspace and lockfile. Preserve the root release/docs responsibilities and the frontend build/test/lint/format responsibilities; do not replace the project's pinned pnpm, OXC, TypeScript, Vite, Vitest, React, or Wails runtime workflow with unrelated tooling.

    - path: "Taskfile.yml"
      instructions: |
        Keep task build, package, run, and dev on Wails v3 and Windows only. Verify task test, lint, fmt, fmt:check, and vuln continue to use the project-pinned commands and that cross-layer changes retain binding generation and a production task build verification path.

    - path: "build/**/*"
      instructions: |
        This directory contains checked-in Wails build and Windows packaging source, not disposable build output. Review Taskfile dependencies, binding generation, embedded frontend assets, version propagation, NSIS behavior, signing/publishing inputs, quoting, and Windows paths.
        Keep generated bindings produced by the Wails v3 generator, keep packaging Windows-only, and do not add macOS, Linux, Android, or iOS targets.

    - path: ".github/**/*.{yml,yaml}"
      instructions: |
        Check that CI uses the repository's Taskfile and pnpm scripts, pins or safely scopes third-party actions, grants least-privilege permissions, caches the correct Go and pnpm inputs, and verifies Go, frontend, generated-binding, release-script, and Windows build behavior appropriate to the changed files.
        The reusable validate-desktop composite action is the canonical full validation gate. Release changes must preserve the main/v3 branch policy, dry-run behavior, complete git history, version propagation, draft release assets, and Windows-only packaging.

    - path: "scripts/**/*.{mjs,ps1}"
      instructions: |
        Review release and packaging scripts for strict argument validation, semantic-version and prerelease mapping, deterministic metadata updates, safe PowerShell quoting, explicit exit failures, and consistency with .releaserc.json, build metadata, NSIS inputs, and release workflow assets.
        Tests must isolate filesystem and environment state and cover malformed input without modifying tracked files.

    - path: "**/*.{yml,yaml,json,jsonc,toml}"
      instructions: |
        Check schema validity, duplicated or conflicting settings, secret leakage, unsafe permissions, Windows-only assumptions, and consistency with Taskfile tasks, package scripts, Wails build configuration, and repository paths.

    - path: "docs/**/*.md"
      instructions: |
        Check technical accuracy, command correctness, VitePress links/frontmatter, and consistency with the current application behavior.
        When a source page changes, check whether the corresponding ko, ja, and zh-CN pages require the same structural or factual update. Do not demand literal translations when locale-specific wording or content is intentional.

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"

chat:
  auto_reply: true
