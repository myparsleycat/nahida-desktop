namespace = LiquidGravityProbe
{{- /*
This file is a template. The importer's adapter, games/<game>/Probe.game.ini,
defines what it calls, and the adapter's other files install next to these.

Camera: every pass reads the camera of camera/Camera.hlsl from
ResourceCamera, and the capture of one draw from ResourceDrawCamera. The
runtime builds them from the game's camera constants in ResourceCameraSource
or ResourceDrawCameraSource, a copy unless the game leaves them unchanged
until they are read, with "camera-rows", which
names the rows they hold in IniParams 254 and 255.x as
camera/BuildCamera.hlsl describes.

"sections" holds the adapter's own sections. Every frame, once the main view
is drawn, they set ResourceCameraSource to its camera constants, point
ResourceDepth at its depth target and set $seen. Once the scene color is
complete they point ResourceSceneColor at it and run CommandListInjectWorld,
which builds ResourceCamera and draws the liquid between saving and
restoring the bindings the runtime uses, then bind the scene color again
wherever the game had it, since drawing to it unbinds it.

"capture-surface" runs in CommandListCaptureSurface, which a mod's hook runs
before its draw with x243 = profile id, y243 = first index and z243 = base
vertex. For a draw of the character in the main view it sets:
- $draw_camera to 1 after setting ResourceDrawCameraSource to the draw's
  camera constants, or to 2 to capture with those of the main view;
- ResourceSurfaceInstance to the draw's object constants and w242
  to the row in it holding the character's world root, with w = 1;
- $capture to 1 to capture with drawindexed, or 2 with
  drawindexedinstanced and FIRST_INSTANCE.
Leaving $capture at 0 skips the draw.

The capture of the draw's triangle into ResourceTrianglePositions runs the
game's vertex shader with a geometry shader whose input ends at the vertex
shader's SV_Position register, which [ShaderRegexLiquidPositionAtK] tells by
filter_index; see there. A ShaderOverride's own filter_index takes precedence
over these, so an adapter sets none on the vertex shaders it captures.
"camera-builder" may name a compute shader to build the camera with instead
of camera/BuildCamera.hlsl, for constants holding the camera in another form;
it reads them at b13 and writes the layout of camera/Camera.hlsl to u0.
"inject-camera" builds ResourceCamera in CommandListInjectWorld; an adapter
whose camera constants change before the injection replaces it with a comment
and runs CommandListBuildCamera when it sees the main view instead. An empty
definition would not replace it.

"mods-enabled" is a condition that holds while the importer draws mods.
"root-low" and "root-high" bound in meters how far below and above the root
an emitter may sit. "release-view" releases the adapter's resources while no
main view is seen, and "end-frame" clears its per-frame state after Present.
*/}}
[Constants]
global $enabled = 1
global $emitting = 1
global $effect_requested = 1
global $last_effect_request = 1
global $shutdown_remaining = 0
global $toggle_pulse_request = 0
global $drain_elapsed = 0
global $seen = 0
global $initialized = 0
global $drawn = 0
global $depth_test = 1
global $strength_level = 3
global $slot_count = 4
global $auto_pulse = 0
global $liquid_tint_r = 0.9
global $liquid_tint_g = 0.75
global $liquid_tint_b = 0.03
global $liquid_absorb_mm = 15
global $liquid_wet_darken = 0.85
global $liquid_puddle_reflect = 0.15
global $liquid_stream_reflect = 1.6
global $liquid_scatter = 0.35
global $liquid_refraction = 0.02
[KeyToggle]
key = no_alt no_ctrl no_shift VK_NUMPAD1
run = CommandListToggleEffect
[CommandListToggleEffect]
if $effect_requested
    $effect_requested = 0
else
    $effect_requested = 1
endif
$toggle_pulse_request = $toggle_pulse_request + 1




[KeyAutoPulse]
key = no_alt no_ctrl no_shift VK_NUMPAD4
type = cycle
$auto_pulse = 0,1

[KeyStrengthUp]
key = no_alt no_ctrl no_shift VK_NUMPAD2
run = CommandListStrengthUp
[CommandListStrengthUp]
if $strength_level < 7
    $strength_level = $strength_level + 1
endif
[KeyStrengthDown]
key = no_alt no_ctrl no_shift VK_NUMPAD3
run = CommandListStrengthDown
[CommandListStrengthDown]
if $strength_level > 0
    $strength_level = $strength_level - 1
endif
; The camera of camera/Camera.hlsl, built every frame.
[ResourceCamera]
type = RWStructuredBuffer
stride = 16
array = 24
[ResourceCameraSource]
[ResourceDepth]
[ResourceSceneColor]
[ResourceFluidLighting]
; The composite's environment light: upper, then broad (fluid/FluidAmbient.hlsl).
[ResourceFluidAmbient]
type = RWStructuredBuffer
stride = 16
array = 2
[CustomShaderFluidAmbient]
cs = fluid/FluidAmbient.hlsl
vs = null
ps = null
hs = null
ds = null
gs = null
cs-t100 = ref ResourceFluidLighting
cs-u0 = ResourceFluidAmbient
dispatch = 1,1,1
cs-u0 = null
cs-t100 = null
[CommandListDrawWorld]
if $enabled && $seen && !$drawn && {{template "mods-enabled"}}
    x241 = $surface_mode
    if !$initialized
        clear = ResourceSlotState
        clear = ResourceFluidA
        clear = ResourceFluidB
        clear = ResourceFluidState
        clear = ResourceFluidSheetFrame
        clear = ResourceFocusMomentum
        clear = ResourceJetGuide
        clear = ResourcePulseState
        clear = ResourceAdhesionFrames
        clear = ResourceSplashA
        clear = ResourceSplashB
        clear = ResourceCollisionEvents
        clear = ResourceCollisionCounter
        clear = ResourceSplashFreeCounter
        clear = ResourcePuddleTransferCounter
        clear = ResourceFluidAmbient
        $initialized = 1
    endif
    ; Snapshot the completed live main-view depth at injection time.
    ; A compute-pass SRV may be an earlier surface or a stencil-plane view.
    ResourceCollisionDepth = copy ResourceDepth
    run = CommandListFluidFrame
    ResourceFluidLighting = copy ResourceSceneColor
    w253 = $fluid_dt
    run = CustomShaderFluidAmbient
    ; Use the same snapshot for collision and occlusion. Normalized UV lookup
    ; also supports final color targets whose size differs from native depth.
    y237 = $depth_test
    ; Look settings for the composite; FluidComposite.hlsl reads this layout.
    x251 = $liquid_tint_r
    y251 = $liquid_tint_g
    z251 = $liquid_tint_b
    w251 = $liquid_absorb_mm / 1000
    x252 = $liquid_wet_darken
    y252 = $liquid_puddle_reflect
    z252 = $liquid_stream_reflect
    w252 = $liquid_scatter
    x253 = $liquid_refraction
    ; Screen-space fluid: particle depth and thickness, two smoothing rounds
    ; ping-ponging A -> B -> A, then one composite over the scene color.
    ResourceFluidDepthA = copy_desc ResourceSceneColor
    ResourceFluidDepthB = copy_desc ResourceSceneColor
    ResourceFluidThicknessA = copy_desc ResourceSceneColor
    ResourceFluidThicknessB = copy_desc ResourceSceneColor
    ResourceFluidColor = copy_desc ResourceSceneColor
    ResourceFluidAbsorptionDepth = copy_desc ResourceSceneColor
    clear = ResourceFluidDepthA 1e30
    clear = ResourceFluidThicknessA 0
    clear = ResourceFluidColor 0
    clear = ResourceFluidAbsorptionDepth 0
    run = CustomShaderFluidSurface
    run = CustomShaderFluidSmoothH
    run = CustomShaderFluidSmoothV
    run = CustomShaderFluidSmoothH
    run = CustomShaderFluidSmoothV
    run = CommandList\LiquidGravityProbe\Composite\FluidComposite
    $drawn = 1
endif
if !$seen
    $initialized = 0
endif
[Present]
; Map transitions/loading frames must not retain old map buffers.
if !$seen
    $initialized = 0
    ResourceCameraSource = null
    ResourceDepth = null
    {{template "release-view"}}
endif
; Key sections only change the request. Lifecycle commands run here, never in Key.
if $effect_requested != $last_effect_request
    $emitting = 1
    if $effect_requested
        $shutdown_remaining = 0
    else
        $shutdown_remaining = 8.0
    endif
    $last_effect_request = $effect_requested
endif
if $emitting
    if !$enabled
        $initialized = 0
    endif
    $enabled = 1
    $drain_elapsed = 0
endif
if !{{template "mods-enabled"}}
    $initialized = 0
endif
post run = CommandListEndFrame
post $seen = 0
post $drawn = 0
[CommandListEndFrame]
{{template "end-frame"}}
clear = ResourceSurfaceCandidates
clear = ResourceSurfaceStats


[Constants]
global $surface_mode = 1
global $capture = 0
global $draw_camera = 0
global $root_low = {{template "root-low"}}
global $root_high = {{template "root-high"}}

[ResourceSurfaceStats]
type = RWStructuredBuffer
stride = 16
array = 9
[ResourceSurfaceInstance]
[ResourceSurfaceProfiles]
type = RWStructuredBuffer
stride = 16
array = 20480
[ResourceSurfaceModelOffsets]
type = RWStructuredBuffer
stride = 16
array = 4096

; Characters the capture hooks reported this frame: a count row, then
; CANDIDATE_ROWS rows for each of CANDIDATE_CAPACITY (ParticleConfig.hlsl).
[ResourceSurfaceCandidates]
type = RWStructuredBuffer
stride = 16
array = 145
; SLOT_ROWS rows for each of SLOT_COUNT character slots (Slots.hlsl).
[ResourceSlotState]
type = RWStructuredBuffer
stride = 16
array = 128
[ResourceDrawCamera]
type = RWStructuredBuffer
stride = 16
array = 24
[ResourceDrawCameraSource]
[ResourceTrianglePositions]
type = Texture2D
format = R32G32B32A32_FLOAT
width = 3
height = 1
array = 1
mips = 1
msaa = 1
msaa_quality = 0
bind_flags = render_target shader_resource
; The capture runs inside the game's own draw, and the shaders it dispatches
; leave their slots changed. A renderer that caches its bindings, such as
; Unreal's, would not bind them again and later passes would read ours.
[CommandListCaptureSurface]
ResourceCaptureSavedCsCB1 = ref cs-cb1
ResourceCaptureSavedCsCB13 = ref cs-cb13
ResourceCaptureSavedCsT0 = ref cs-t0
ResourceCaptureSavedCsT1 = ref cs-t1
ResourceCaptureSavedCsT2 = ref cs-t2
ResourceCaptureSavedCsT113 = ref cs-t113
ResourceCaptureSavedCsU0 = ref cs-u0
ResourceCaptureSavedCsU1 = ref cs-u1
ResourceCaptureSavedGsT113 = ref gs-t113
run = CommandListCaptureSurfaceBody
cs-cb1 = ref ResourceCaptureSavedCsCB1
cs-cb13 = ref ResourceCaptureSavedCsCB13
cs-t0 = ref ResourceCaptureSavedCsT0
cs-t1 = ref ResourceCaptureSavedCsT1
cs-t2 = ref ResourceCaptureSavedCsT2
cs-t113 = ref ResourceCaptureSavedCsT113
cs-u0 = ref ResourceCaptureSavedCsU0
cs-u1 = ref ResourceCaptureSavedCsU1
gs-t113 = ref ResourceCaptureSavedGsT113
ResourceCaptureSavedCsCB1 = null
ResourceCaptureSavedCsCB13 = null
ResourceCaptureSavedCsT0 = null
ResourceCaptureSavedCsT1 = null
ResourceCaptureSavedCsT2 = null
ResourceCaptureSavedCsT113 = null
ResourceCaptureSavedCsU0 = null
ResourceCaptureSavedCsU1 = null
ResourceCaptureSavedGsT113 = null
[ResourceCaptureSavedCsCB1]
[ResourceCaptureSavedCsCB13]
[ResourceCaptureSavedCsT0]
[ResourceCaptureSavedCsT1]
[ResourceCaptureSavedCsT2]
[ResourceCaptureSavedCsT113]
[ResourceCaptureSavedCsU0]
[ResourceCaptureSavedCsU1]
[ResourceCaptureSavedGsT113]
[CommandListCaptureSurfaceBody]
run = CommandList\LiquidGravityProbe\JSONProfiles\Initialize
if $surface_mode && $enabled && {{template "mods-enabled"}}
    $capture = 0
    $draw_camera = 0
    {{template "capture-surface"}}
    if $capture && $draw_camera
        if $draw_camera == 2
            ResourceDrawCameraSource = copy ResourceCameraSource
        endif
        run = CommandListBuildDrawCamera
        x242 = $root_low
        y242 = $root_high
        {{- range $k := 13}}{{if $k}}
        {{if gt $k 1}}el{{end}}if vs == 6120{{printf "%02d" $k}}
            run = CustomShaderCaptureTrianglePosition{{$k}}
        {{- end}}{{end}}
        else
            run = CustomShaderCaptureTriangle
        endif
        run = CustomShaderResolveSurface
    endif
endif
; Vertex shaders may write SV_Position after their other outputs, at a
; register that differs between them, as Unreal's and some of Unity's do. A
; geometry shader whose input holds only SV_Position reads register 0, so
; each filter_index 6120KK below names register K and selects
; surface/CaptureTriangle_PositionK.hlsl, which declares the registers before
; it. Shaders matching none write it to register 0.
{{- range $k := 13}}{{if $k}}
[ShaderRegexLiquidPositionAt{{$k}}]
shader_model = vs_4_0 vs_4_1 vs_5_0 vs_5_1
filter_index = 6120{{printf "%02d" $k}}
[ShaderRegexLiquidPositionAt{{$k}}.Pattern]
dcl_output_siv\h+o{{$k}}\.xyzw,\h+position
{{- end}}{{end}}
; These keep the game's vertex shader and all its skinning inputs bound.
{{- range $k := 13}}
[CustomShaderCaptureTriangle{{if $k}}Position{{$k}}{{end}}]
gs = surface/CaptureTriangle{{if $k}}_Position{{$k}}{{end}}.hlsl
ps = surface/CaptureTriangle.hlsl
hs = null
ds = null
cs = null
gs-t113 = ResourceDrawCamera
cull = none
depth_enable = false
blend = disable
topology = triangle_list
clear = ResourceTrianglePositions
run = BuiltInCommandListUnbindAllRenderTargets
o0 = set_viewport ResourceTrianglePositions
if $capture == 2
    drawindexedinstanced = 3,1,y243,z243,FIRST_INSTANCE
else
    drawindexed = 3,y243,z243
endif
gs-t113 = null
{{- end}}
[CustomShaderResolveSurface]
cs = surface/ResolveSurface.hlsl
vs = null
ps = null
gs = null
hs = null
ds = null
cs-t0 = ref ResourceTrianglePositions
cs-t1 = ref ResourceSurfaceProfiles
cs-t2 = ref ResourceSurfaceModelOffsets
cs-t113 = ResourceDrawCamera
cs-cb1 = ref ResourceSurfaceInstance
cs-u0 = ResourceSurfaceCandidates
cs-u1 = ResourceSurfaceStats
dispatch = 1,1,1
cs-u0 = null
cs-u1 = null
cs-t2 = null
cs-t113 = null

[CommandListBuildCamera]
{{template "camera-rows"}}
run = CustomShaderBuildCamera
[CustomShaderBuildCamera]
cs = {{block "camera-builder" .}}camera/BuildCamera.hlsl{{end}}
vs = null
ps = null
gs = null
hs = null
ds = null
cs-cb13 = ref ResourceCameraSource
cs-u0 = ResourceCamera
dispatch = 1,1,1
cs-u0 = null
[CommandListBuildDrawCamera]
{{template "camera-rows"}}
run = CustomShaderBuildDrawCamera
[CustomShaderBuildDrawCamera]
cs = {{template "camera-builder"}}
vs = null
ps = null
gs = null
hs = null
ds = null
cs-cb13 = ref ResourceDrawCameraSource
cs-u0 = ResourceDrawCamera
dispatch = 1,1,1
cs-u0 = null

