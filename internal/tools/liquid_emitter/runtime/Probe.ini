[Constants]
global $fluid_last_time = 0
global $fluid_dt = 0.0166667
[ResourceFluidA]
type = RWStructuredBuffer
stride = 64
array = 8192
[ResourceFluidB]
type = RWStructuredBuffer
stride = 64
array = 8192
[ResourceJetGuide]
type = RWStructuredBuffer
stride = 64
array = 8192
[ResourceFocusMomentum]
type = RWStructuredBuffer
stride = 16
array = 8192
[ResourceFluidSheetFrame]
type = RWStructuredBuffer
stride = 16
array = 8192
; Four rows per slot (FluidSolver.hlsl PHASE_STATE).
[ResourceFluidState]
type = RWStructuredBuffer
stride = 16
array = 32
[CommandListFluidFrame]
$fluid_dt = time - $fluid_last_time
$fluid_last_time = time
if $fluid_dt <= 0 || $fluid_dt > 0.1
    $fluid_dt = 0.0166667
elif $fluid_dt > 0.0333333
    $fluid_dt = 0.0333333
endif
x238 = 0.012
y238 = 0.0000213333
z238 = 1000
w238 = 0.000001
x239 = $fluid_dt / 2
y239 = time - $fluid_dt / 2
z239 = 0
if !$effect_requested && $shutdown_remaining > 0
    $shutdown_remaining = $shutdown_remaining - $fluid_dt
    if $shutdown_remaining <= 0
        $emitting = 0
    endif
endif
x237 = $emitting
; y253 held the strength level, which each emitter's force replaced
; (Slots.hlsl slotDrive).
; y253 = $strength_level
; How many of the SLOT_COUNT slots AssignSlots fills.
z253 = $slot_count
w237 = $manual_hold
w239 = $auto_pulse
w240 = $toggle_pulse_request
z240 = $effect_requested
run = CustomShaderAssignSlots
run = CustomShaderPulse
run = CustomShaderEmitterAdvance
clear = ResourceCollisionCounter
clear = ResourceSplashFreeCounter
clear = ResourcePuddleTransferCounter
clear = ResourceOozeDelivered
run = CustomShaderSplashUpdate
run = CommandListFluidSubstep
y239 = time
z239 = 1
run = CommandListFluidSubstep
run = CustomShaderSplashMerge
run = CustomShaderSplashSpawn
run = CustomShaderOozeCommit
run = CustomShaderFluidState
run = CustomShaderStreamLink
; Main particles retire within .48s; retained surface droplets within another 1.6s.
; Count simulated time so a slow frame cannot cut surviving splashes short.
; Those drops may still pour into a puddle within those 3s, and a puddle
; grown to $liquid_puddle_size lasts at most 2.4s plus $liquid_puddle_linger
; times 2.2 + size/40 after that (fluid/Puddle.hlsl puddleLifetime, which
; has no closed form here).
if !$emitting
    $drain_elapsed = $drain_elapsed + $fluid_dt
    if $drain_elapsed > 5.4 + 2.2 * $liquid_puddle_linger + $liquid_puddle_linger * $liquid_puddle_size / 40
        $enabled = 0
        $initialized = 0
    endif
else
    $drain_elapsed = 0
endif
