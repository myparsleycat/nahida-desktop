cs-u0 = null
[CommandListBuildDrawCamera]
{{template "camera-rows"}}
run = CustomShaderBuildDrawCamera
[CustomShaderBuildDrawCamera]
cs = {{template "camera-builder"}}
vs = null
ps = null
gs = null
hs = null
ds = null
cs-cb13 = ref ResourceDrawCameraSource
cs-u0 = ResourceDrawCamera
