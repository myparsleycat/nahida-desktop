endif
[ShaderOverrideCommonFinalSceneStage]
; Shared fullscreen VS in all three captured maps, independent of PS variant.
hash = 833324977c629596
allow_duplicate_hash = true
if $seen && $enabled && !$drawn && $\EFMIv1\enable_mods
