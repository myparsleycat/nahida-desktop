if $seen && !$drawn && od == 924172 && DRAW_TYPE % 2 == 0
    if vs-cb0->Size == 1536 && vs-cb1->Size == 3328
        ResourceDepth = ref od
    elif vs-cb1->Size == 1536 && vs-cb2->Size == 3328
        ResourceDepth = ref od
