namespace = LiquidGravityProbe
{{- /*
This file is a template. The importer's adapter, games/<game>/Probe.game.ini,
defines what it calls, and the adapter's other files install next to these.

"sections" holds the adapter's own sections. Every frame they set $seen once
the main view is drawn, with ResourceCamera holding its camera and
ResourceDepth its depth target. Once the scene color is complete they point
ResourceSceneColor at it and run CommandListDrawWorld, then restore the game
bindings that run replaced.

"capture-surface" is the body of CommandListCaptureSurface, which a mod's hook
runs before its draw with x243 = profile id, y243 = first index and z243 =
base vertex. It sets ResourceDrawCamera and ResourceSurfaceInstance and runs
CustomShaderCaptureTriangle, or the Instanced one, then
CustomShaderResolveSurface. surface/CharacterRoot.hlsl defines
characterRoot(), the drawn character's world root read from the instance
buffer at b1, with w = 1 when there is one.

"mods-enabled" is a condition that holds while the importer draws mods.
"release-view" releases the adapter's resources while no main view is seen,
and "end-frame" clears its per-frame state after Present.

Camera buffers hold 96 float4 rows: 4-6 the inverse view rotation, 7 the eye
position, 8.x the projection's horizontal scale, 12-15 the inverse projection
and 16-19 the view-projection. World space is in meters with Y up, which
gravity and the root checks in ResolveSurface.hlsl assume.
*/}}
[Constants]
global $enabled = 1
global $emitting = 1
global $effect_requested = 1
global $last_effect_request = 1
global $shutdown_remaining = 0
global $toggle_pulse_request = 0
global $drain_elapsed = 0
global $seen = 0
global $initialized = 0
global $drawn = 0
global $depth_test = 1
global $strength_level = 3
global $slot_count = 4
global $auto_pulse = 0
global $liquid_tint_r = 0.9
global $liquid_tint_g = 0.75
global $liquid_tint_b = 0.03
global $liquid_absorb_mm = 15
global $liquid_wet_darken = 0.85
global $liquid_puddle_reflect = 0.15
global $liquid_stream_reflect = 1.6
global $liquid_scatter = 0.35
global $liquid_refraction = 0.02
[KeyToggle]
key = no_alt no_ctrl no_shift VK_NUMPAD1
run = CommandListToggleEffect
[CommandListToggleEffect]
if $effect_requested
    $effect_requested = 0
else
    $effect_requested = 1
endif
$toggle_pulse_request = $toggle_pulse_request + 1




[KeyAutoPulse]
key = no_alt no_ctrl no_shift VK_NUMPAD4
type = cycle
$auto_pulse = 0,1

[KeyStrengthUp]
key = no_alt no_ctrl no_shift VK_NUMPAD2
run = CommandListStrengthUp
[CommandListStrengthUp]
if $strength_level < 7
    $strength_level = $strength_level + 1
endif
[KeyStrengthDown]
key = no_alt no_ctrl no_shift VK_NUMPAD3
run = CommandListStrengthDown
[CommandListStrengthDown]
if $strength_level > 0
    $strength_level = $strength_level - 1
endif
[ResourceCamera]
[ResourceDepth]
[ResourceSceneColor]
[ResourceFluidLighting]
[CommandListDrawWorld]
if $enabled && $seen && !$drawn && {{template "mods-enabled"}}
    x241 = $surface_mode
    if !$initialized
        clear = ResourceSlotState
        clear = ResourceFluidA
        clear = ResourceFluidB
        clear = ResourceFluidState
        clear = ResourceFluidSheetFrame
        clear = ResourceFocusMomentum
        clear = ResourceJetGuide
        clear = ResourcePulseState
        clear = ResourceAdhesionFrames
        clear = ResourceSplashA
        clear = ResourceSplashB
        clear = ResourceCollisionEvents
        clear = ResourceCollisionCounter
        clear = ResourceSplashFreeCounter
        clear = ResourcePuddleTransferCounter
        $initialized = 1
    endif
    ; Snapshot the completed live main-view depth at injection time.
    ; A compute-pass SRV may be an earlier surface or a stencil-plane view.
    ResourceCollisionDepth = copy ResourceDepth
    run = CommandListFluidFrame
    ResourceFluidLighting = copy ResourceSceneColor
    ; Use the same snapshot for collision and occlusion. Normalized UV lookup
    ; also supports final color targets whose size differs from native depth.
    y237 = $depth_test
    ; Look settings for the composite; FluidComposite.hlsl reads this layout.
    x251 = $liquid_tint_r
    y251 = $liquid_tint_g
    z251 = $liquid_tint_b
    w251 = $liquid_absorb_mm / 1000
    x252 = $liquid_wet_darken
    y252 = $liquid_puddle_reflect
    z252 = $liquid_stream_reflect
    w252 = $liquid_scatter
    x253 = $liquid_refraction
    ; Screen-space fluid: particle depth and thickness, two smoothing rounds
    ; ping-ponging A -> B -> A, then one composite over the scene color.
    ResourceFluidDepthA = copy_desc ResourceSceneColor
    ResourceFluidDepthB = copy_desc ResourceSceneColor
    ResourceFluidThicknessA = copy_desc ResourceSceneColor
    ResourceFluidThicknessB = copy_desc ResourceSceneColor
    ResourceFluidColor = copy_desc ResourceSceneColor
    ResourceFluidAbsorptionDepth = copy_desc ResourceSceneColor
    clear = ResourceFluidDepthA 1e30
    clear = ResourceFluidThicknessA 0
    clear = ResourceFluidColor 0
    clear = ResourceFluidAbsorptionDepth 0
    run = CustomShaderFluidSurface
    run = CustomShaderFluidSmoothH
    run = CustomShaderFluidSmoothV
    run = CustomShaderFluidSmoothH
    run = CustomShaderFluidSmoothV
    run = CommandList\LiquidGravityProbe\Composite\FluidComposite
    $drawn = 1
endif
if !$seen
    $initialized = 0
endif
[Present]
; Map transitions/loading frames must not retain old map buffers.
if !$seen
    $initialized = 0
    ResourceCamera = null
    ResourceDepth = null
    {{template "release-view"}}
endif
; Key sections only change the request. Lifecycle commands run here, never in Key.
if $effect_requested != $last_effect_request
    $emitting = 1
    if $effect_requested
        $shutdown_remaining = 0
    else
        $shutdown_remaining = 8.0
    endif
    $last_effect_request = $effect_requested
endif
if $emitting
    if !$enabled
        $initialized = 0
    endif
    $enabled = 1
    $drain_elapsed = 0
endif
if !{{template "mods-enabled"}}
    $initialized = 0
endif
post run = CommandListEndFrame
post $seen = 0
post $drawn = 0
[CommandListEndFrame]
{{template "end-frame"}}
clear = ResourceSurfaceCandidates
clear = ResourceSurfaceStats


[Constants]
global $surface_mode = 1
global $draw_camera = 0

[ResourceSurfaceStats]
type = RWStructuredBuffer
stride = 16
array = 9
[ResourceSurfaceInstance]
[ResourceSurfaceProfiles]
type = RWStructuredBuffer
stride = 16
array = 20480
[ResourceSurfaceModelOffsets]
type = RWStructuredBuffer
stride = 16
array = 4096

; Characters the capture hooks reported this frame: a count row, then
; CANDIDATE_ROWS rows for each of CANDIDATE_CAPACITY (ParticleConfig.hlsl).
[ResourceSurfaceCandidates]
type = RWStructuredBuffer
stride = 16
array = 145
; SLOT_ROWS rows for each of SLOT_COUNT character slots (Slots.hlsl).
[ResourceSlotState]
type = RWStructuredBuffer
stride = 16
array = 128
[ResourceDrawCamera]
[ResourceTrianglePositions]
type = Texture2D
format = R32G32B32A32_FLOAT
width = 3
height = 1
array = 1
mips = 1
msaa = 1
msaa_quality = 0
bind_flags = render_target shader_resource
[CommandListCaptureSurface]
run = CommandList\LiquidGravityProbe\JSONProfiles\Initialize
{{template "capture-surface"}}
[CustomShaderCaptureTriangle]
; Intentionally preserve the active game VS and all its skinning inputs.
gs = surface/CaptureTriangle.hlsl
ps = surface/CaptureTriangle.hlsl
hs = null
ds = null
cs = null
gs-cb13 = ref ResourceDrawCamera
cull = none
depth_enable = false
blend = disable
topology = triangle_list
clear = ResourceTrianglePositions
run = BuiltInCommandListUnbindAllRenderTargets
o0 = set_viewport ResourceTrianglePositions
drawindexed = 3,y243,z243
[CustomShaderCaptureTriangleInstanced]
gs = surface/CaptureTriangle.hlsl
ps = surface/CaptureTriangle.hlsl
hs = null
ds = null
cs = null
gs-cb13 = ref ResourceDrawCamera
cull = none
depth_enable = false
blend = disable
topology = triangle_list
clear = ResourceTrianglePositions
run = BuiltInCommandListUnbindAllRenderTargets
o0 = set_viewport ResourceTrianglePositions
drawindexedinstanced = 3,1,y243,z243,FIRST_INSTANCE
[CustomShaderResolveSurface]
cs = surface/ResolveSurface.hlsl
vs = null
ps = null
gs = null
hs = null
ds = null
cs-t0 = ref ResourceTrianglePositions
cs-t1 = ref ResourceSurfaceProfiles
cs-t2 = ref ResourceSurfaceModelOffsets
cs-cb13 = ref ResourceDrawCamera
cs-cb1 = ref ResourceSurfaceInstance
cs-u0 = ResourceSurfaceCandidates
cs-u1 = ResourceSurfaceStats
dispatch = 1,1,1
cs-u0 = null
cs-u1 = null
cs-t2 = null


[Constants]
global $fluid_last_time = 0
global $fluid_dt = 0.0166667
[ResourceFluidA]
type = RWStructuredBuffer
stride = 64
array = 8192
[ResourceFluidB]
type = RWStructuredBuffer
stride = 64
array = 8192
[ResourceJetGuide]
type = RWStructuredBuffer
stride = 64
array = 8192
[ResourceFocusMomentum]
type = RWStructuredBuffer
stride = 16
array = 8192
[ResourceFluidSheetFrame]
type = RWStructuredBuffer
stride = 16
array = 8192
; Four rows per slot (FluidSolver.hlsl PHASE_STATE).
[ResourceFluidState]
type = RWStructuredBuffer
stride = 16
array = 32
[CommandListFluidFrame]
$fluid_dt = time - $fluid_last_time
$fluid_last_time = time
if $fluid_dt <= 0 || $fluid_dt > 0.1
    $fluid_dt = 0.0166667
elif $fluid_dt > 0.0333333
    $fluid_dt = 0.0333333
endif
x238 = 0.012
y238 = 0.0000213333
z238 = 1000
w238 = 0.000001
x239 = $fluid_dt / 2
y239 = time - $fluid_dt / 2
z239 = 0
if !$effect_requested && $shutdown_remaining > 0
    $shutdown_remaining = $shutdown_remaining - $fluid_dt
    if $shutdown_remaining <= 0
        $emitting = 0
    endif
endif
x237 = $emitting
; Each slot maps the level, shifted by its character's offset, to its
; nozzle setting (Slots.hlsl slotDrive).
y253 = $strength_level
; How many of the SLOT_COUNT slots AssignSlots fills.
z253 = $slot_count
w237 = $manual_hold
w239 = $auto_pulse
w240 = $toggle_pulse_request
z240 = $effect_requested
run = CustomShaderAssignSlots
run = CustomShaderPulse
clear = ResourceCollisionCounter
clear = ResourceSplashFreeCounter
clear = ResourcePuddleTransferCounter
run = CustomShaderSplashUpdate
run = CommandListFluidSubstep
y239 = time
z239 = 1
run = CommandListFluidSubstep
run = CustomShaderSplashSpawn
run = CustomShaderFluidState
; Main particles retire within .48s; retained surface droplets within another 1.6s.
; Count simulated time so a slow frame cannot cut surviving splashes short.
if !$emitting
    $drain_elapsed = $drain_elapsed + $fluid_dt
    if $drain_elapsed > 3.0
        $enabled = 0
        $initialized = 0
    endif
else
    $drain_elapsed = 0
endif
[CommandListFluidSubstep]
run = CustomShaderFluidPredict
run = CustomShaderFluidDensity
run = CustomShaderFluidCorrect
run = CustomShaderFluidDensity
run = CustomShaderFluidCorrect
run = CustomShaderFluidDensity
run = CustomShaderFluidCorrect
run = CustomShaderFluidFinalize

[CustomShaderFluidPredict]
cs = fluid/FluidPredict.hlsl
vs = null
ps = null
hs = null
ds = null
gs = null
cs-t100 = ResourceFluidA
cs-t103 = ResourceSlotState
cs-t109 = ResourcePulseState
cs-t105 = ResourceFluidState
cs-u5 = ResourceFluidSheetFrame
cs-u7 = ResourceJetGuide
cs-u6 = ResourceFocusMomentum
cs-u0 = ResourceFluidB
dispatch = 128,1,1
cs-u0 = null
cs-u6 = null
cs-u7 = null
cs-u5 = null
cs-t100 = null
cs-t105 = null
cs-t109 = null

[CustomShaderFluidDensity]
cs = fluid/FluidDensity.hlsl
vs = null
ps = null
hs = null
ds = null
gs = null
cs-t100 = ResourceFluidB
cs-t111 = ResourceFluidSheetFrame
cs-t103 = ResourceSlotState
cs-t109 = ResourcePulseState
cs-t105 = ResourceFluidState
cs-u0 = ResourceFluidA
dispatch = 128,1,1
cs-u0 = null
cs-t100 = null
cs-t111 = null
cs-t105 = null
cs-t109 = null

[CustomShaderFluidCorrect]
cs = fluid/FluidCorrect.hlsl
vs = null
ps = null
hs = null
ds = null
gs = null
cs-t100 = ResourceFluidA
cs-t111 = ResourceFluidSheetFrame
cs-t103 = ResourceSlotState
cs-t109 = ResourcePulseState
cs-t105 = ResourceFluidState
cs-u0 = ResourceFluidB
dispatch = 128,1,1
cs-u0 = null
cs-t100 = null
cs-t111 = null
cs-t105 = null
cs-t109 = null

[CustomShaderFluidFinalize]
cs = fluid/FluidFinalize.hlsl
vs = null
ps = null
hs = null
ds = null
gs = null
cs-t100 = ResourceFluidB
cs-t111 = ResourceFluidSheetFrame
cs-t103 = ResourceSlotState
cs-t109 = ResourcePulseState
cs-t105 = ResourceFluidState
cs-cb13 = ref ResourceCamera
cs-t106 = ref ResourceCollisionDepth
cs-u2 = ResourceCollisionEvents
cs-u3 = ResourceCollisionCounter
cs-u6 = ResourceFocusMomentum
cs-u0 = ResourceFluidA
dispatch = 128,1,1
cs-u0 = null
cs-u6 = null
cs-u2 = null
cs-u3 = null
cs-t106 = null
cs-t100 = null
cs-t111 = null
cs-t105 = null
cs-t109 = null

[CustomShaderAssignSlots]
cs = fluid/AssignSlots.hlsl
vs = null
ps = null
hs = null
ds = null
gs = null
cs-t0 = ResourceSurfaceCandidates
cs-t1 = ref ResourceSurfaceProfiles
cs-u0 = ResourceSlotState
cs-u1 = ResourceFluidState
dispatch = 1,1,1
cs-u0 = null
cs-u1 = null
cs-t0 = null
cs-t1 = null

[CustomShaderFluidState]
cs = fluid/FluidState.hlsl
vs = null
ps = null
hs = null
ds = null
gs = null
cs-t103 = ResourceSlotState
cs-t109 = ResourcePulseState
cs-u1 = ResourceFluidState
dispatch = 1,1,1
cs-u1 = null
cs-t109 = null

; Screen-space fluid targets follow the final color target's size through
; copy_desc each frame; the format and bind flags below override the copy.
[ResourceFluidDepthA]
type = Texture2D
format = R32_FLOAT
mips = 1
array = 1
msaa = 1
msaa_quality = 0
bind_flags = render_target shader_resource
[ResourceFluidDepthB]
type = Texture2D
format = R32_FLOAT
mips = 1
array = 1
msaa = 1
msaa_quality = 0
bind_flags = render_target shader_resource
[ResourceFluidThicknessA]
type = Texture2D
format = R32_FLOAT
mips = 1
array = 1
msaa = 1
msaa_quality = 0
bind_flags = render_target shader_resource
[ResourceFluidThicknessB]
type = Texture2D
format = R32_FLOAT
mips = 1
array = 1
msaa = 1
msaa_quality = 0
bind_flags = render_target shader_resource
; Thickness-weighted absorption and absorption depth of each character's
; liquid (FluidSurface.hlsl). The composite reads them unsmoothed, so they
; need no second copy.
[ResourceFluidColor]
type = Texture2D
format = R16G16B16A16_FLOAT
mips = 1
array = 1
msaa = 1
msaa_quality = 0
bind_flags = render_target shader_resource
[ResourceFluidAbsorptionDepth]
type = Texture2D
format = R16_FLOAT
mips = 1
array = 1
msaa = 1
msaa_quality = 0
bind_flags = render_target shader_resource

[CustomShaderFluidSurface]
vs = fluid/FluidSurface.hlsl
ps = fluid/FluidSurface.hlsl
hs = null
ds = null
gs = null
cs = null
vs-cb13 = ref ResourceCamera
ps-cb13 = ref ResourceCamera
ps-t106 = ref ResourceCollisionDepth
vs-t100 = ResourceFluidA
vs-t101 = ResourceSplashA
vs-t103 = ResourceSlotState
vs-t112 = ResourceJetGuide
cull = none
depth_enable = false
depth_write_mask = zero
blend = min one one
blend[1] = add one one
blend[2] = add one one
; blend sets only the color channels; the weight in alpha must add up too,
; or the composite divides the summed absorption by the last particle's.
alpha[2] = add one one
blend[3] = add one one
topology = triangle_list
run = BuiltInCommandListUnbindAllRenderTargets
o0 = set_viewport ResourceFluidDepthA
o1 = ResourceFluidThicknessA
o2 = ResourceFluidColor
o3 = ResourceFluidAbsorptionDepth
draw = 86016,0
vs-t100 = null
vs-t101 = null
vs-t103 = null
vs-t112 = null
ps-t106 = null

[CustomShaderFluidSmoothH]
vs = fluid/FluidSmoothH.hlsl
ps = fluid/FluidSmoothH.hlsl
hs = null
ds = null
gs = null
cs = null
ps-cb13 = ref ResourceCamera
ps-t100 = ResourceFluidDepthA
ps-t101 = ResourceFluidThicknessA
cull = none
depth_enable = false
depth_write_mask = zero
blend = disable
blend[1] = disable
topology = triangle_list
run = BuiltInCommandListUnbindAllRenderTargets
o0 = set_viewport ResourceFluidDepthB
o1 = ResourceFluidThicknessB
draw = 3,0
ps-t100 = null
ps-t101 = null

[CustomShaderFluidSmoothV]
