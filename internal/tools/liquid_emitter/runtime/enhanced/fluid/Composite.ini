; Composite pass of the screen-space fluid, for the forked d3d11.dll that
; binds INI sampler states: refraction and reflection sample the scene with
; a hardware bilinear sampler. Installed over fluid/Composite.ini.
namespace = LiquidGravityProbe\Composite
[Constants]
global $sampler_slots = 0

[CommandListFluidComposite]
; A DLL without sampler slots drops this line when loading, with a warning,
; and the plain composite runs; naming dll_sampler_slots in the if would
; leave its else and endif without their if.
$sampler_slots = dll_sampler_slots
if $sampler_slots
    run = CustomShaderFluidCompositeSampled
else
    run = CustomShaderFluidComposite
endif

[ResourceLinearClamp]
type = SamplerState
filter = linear
address = clamp

[CustomShaderFluidCompositeSampled]
vs = FluidCompositeSampled.hlsl
ps = FluidCompositeSampled.hlsl
hs = null
ds = null
gs = null
cs = null
ps-t113 = Resource\LiquidGravityProbe\Camera
ps-t100 = Resource\LiquidGravityProbe\FluidDepthA
ps-t101 = Resource\LiquidGravityProbe\FluidThicknessA
ps-t102 = Resource\LiquidGravityProbe\FluidColor
ps-t103 = Resource\LiquidGravityProbe\FluidAbsorptionDepth
ps-t104 = ref Resource\LiquidGravityProbe\FluidLighting
ps-t106 = ref Resource\LiquidGravityProbe\CollisionDepth
ps-s0 = ResourceLinearClamp
cull = none
depth_enable = false
depth_write_mask = zero
blend = add src_alpha inv_src_alpha
topology = triangle_list
run = BuiltInCommandListUnbindAllRenderTargets
; The scene color may be the swap chain's back buffer, which a cached view
; would hold on to and keep from being resized.
o0 = set_viewport no_view_cache Resource\LiquidGravityProbe\SceneColor
draw = 3,0
ps-t100 = null
ps-t101 = null
ps-t102 = null
ps-t103 = null
ps-t104 = null
ps-t106 = null
ps-t113 = null

[CustomShaderFluidComposite]
vs = FluidComposite.hlsl
ps = FluidComposite.hlsl
hs = null
ds = null
gs = null
cs = null
ps-t113 = Resource\LiquidGravityProbe\Camera
ps-t100 = Resource\LiquidGravityProbe\FluidDepthA
ps-t101 = Resource\LiquidGravityProbe\FluidThicknessA
ps-t102 = Resource\LiquidGravityProbe\FluidColor
ps-t103 = Resource\LiquidGravityProbe\FluidAbsorptionDepth
ps-t104 = ref Resource\LiquidGravityProbe\FluidLighting
ps-t106 = ref Resource\LiquidGravityProbe\CollisionDepth
cull = none
depth_enable = false
depth_write_mask = zero
blend = add src_alpha inv_src_alpha
topology = triangle_list
run = BuiltInCommandListUnbindAllRenderTargets
; The scene color may be the swap chain's back buffer, which a cached view
; would hold on to and keep from being resized.
o0 = set_viewport no_view_cache Resource\LiquidGravityProbe\SceneColor
draw = 3,0
ps-t100 = null
ps-t101 = null
ps-t102 = null
ps-t103 = null
ps-t104 = null
ps-t106 = null
ps-t113 = null
