{{/* SRMI adapter for runtime/Probe.ini; its header names each template. */}}
{{define "mods-enabled"}}$costume_mods{{end}}
{{- /* Each part is drawn with its own bone as root; the body's is the pelvis,
about 0.75 m above the feet, and the face's and hair's the head. */}}
{{define "root-low"}}-1.3{{end}}
{{define "root-high"}}1.2{{end}}
{{define "camera-rows" -}}
; Unity's per-camera constants: view and the jittered view-projection. The
; inverse view in row 27 is the previous frame's, which differs while the
; camera turns, so it is derived from the view. Their projection is the
; OpenGL one rather than the reversed-Z one drawn with, which is derived from
; the view-projection.
x254 = 23
y254 = -1
z254 = -1
w254 = -1
x255 = 31
{{- end}}
{{define "release-view"}}{{end}}
{{define "end-frame"}}{{end}}
{{define "capture-surface" -}}
; Characters draw the main view's G-buffer with the camera at cb1 and the
    ; object constants at cb2, whose row 3 is the world root of the part drawn.
    ; Their shadow and outline passes bind other layouts and are skipped.
    if o2 !== null && o3 === null && vs-cb1 == 3130656 && vs-cb2 == 3130352
        ResourceDrawCameraSource = copy vs-cb1
        $draw_camera = 1
        ResourceSurfaceInstance = copy vs-cb2
        w242 = 3
        $capture = 1
    endif
{{- end}}
{{define "sections" -}}
[Constants]
global $main_width = 0
; Unity binds whole constant buffers without an offset, for which ->Size
; reports the 65536-byte maximum, so the layouts below are told apart by the
; buffers' own sizes through these filter indices. The camera constants are
; rewritten before every draw, so they are copied where they are read.
[TextureOverrideLiquidCameraConstants]
match_type = Buffer
match_usage = dynamic
match_bind_flags = +constant_buffer
match_byte_width = 656
filter_index = 3130656
; Bodies bind the smaller object constants and faces, hair and scenery the
; larger; both hold the world root in row 3.
[TextureOverrideLiquidObjectConstants]
match_type = Buffer
match_usage = dynamic
match_bind_flags = +constant_buffer
match_byte_width = 352
filter_index = 3130352
[TextureOverrideLiquidObjectConstantsExtended]
match_type = Buffer
match_usage = dynamic
match_bind_flags = +constant_buffer
match_byte_width = 512
filter_index = 3130352
[TextureOverrideLiquidSceneColor]
match_type = Texture2D
match_format = R11G11B10_FLOAT
match_bind_flags = +render_target +shader_resource
match_msaa = 1
filter_index = 3131011
; The main view draws its G-buffer to three render targets; shadows draw to
; none and outlines and the forward passes to fewer.
[ShaderRegexLiquidMainView]
shader_model = vs_4_0 vs_4_1 vs_5_0 vs_5_1
if !$seen && $costume_mods && DRAW_TYPE % 2 == 0 && o2 !== null && o3 === null && od !== null
    if vs-cb1 == 3130656 && vs-cb2 == 3130352
        ResourceCameraSource = copy vs-cb1
        ResourceDepth = ref od
        $main_width = o0->Width
        $seen = 1
    endif
endif
; Unity's uber post pass tone maps the main view's HDR scene at ps-t0 into the
; back buffer's size, which is smaller where the game renders above it. The
; same vertex shader blurs and blends the tone mapped image for the UI, which
; reads no HDR target.
[ShaderOverrideLiquidTonemap]
hash = 3264fc6261b03a9f
allow_duplicate_hash = true
if $seen && $enabled && !$drawn && $costume_mods && o0 !== null && o0 != 3131011
    if ps-t0 == 3131011 && ps-t0->Width == $main_width
        ResourceSceneColor = ref ps-t0
        ps-t0 = null
        run = CommandListInjectWorld
        ps-t0 = ref ResourceSceneColor
    endif
endif
{{- end}}
