{{/* GIMI adapter for runtime/Probe.ini; its header names each template. */}}
{{define "mods-enabled"}}$costume_mods{{end}}
{{- /* The root is the pelvis bone, about 0.8 m above the feet. */}}
{{define "root-low"}}-1.3{{end}}
{{define "root-high"}}1.2{{end}}
{{define "camera-rows" -}}
; Unity's per-frame constants hold the projection in row 5, the view in 9, its
; inverse in 13 and the view-projection in 17, but each shader's copy fills
; only the rows it reads and leaves the others zero. Every G-buffer shader
; reads the view-projection, so the camera is split from it alone.
x254 = -1
y254 = -1
z254 = -1
w254 = -1
x255 = 17
{{- end}}
{{define "release-view"}}{{end}}
{{define "end-frame"}}{{end}}
{{define "capture-surface" -}}
; Characters draw their colour pass with the object constants at cb2, whose
    ; row 3 is the world root, and the camera at cb3. Their outline and shadow
    ; passes bind other layouts and are skipped.
    if vs-cb2 == 3110160 && vs-cb3 == 3110560
        ResourceDrawCameraSource = copy vs-cb3->Region(vs-cb3->Offset,560)
        $draw_camera = 1
        ResourceSurfaceInstance = copy vs-cb2->Region(vs-cb2->Offset,160)
        w242 = 3
        $capture = 1
    endif
{{- end}}
{{define "sections" -}}
; Unity binds whole constant buffers without an offset, for which ->Size
; reports the 65536-byte maximum, so the layouts below are told apart by the
; buffers' own sizes through these filter indices.
[TextureOverrideLiquidObjectConstants]
match_type = Buffer
match_usage = dynamic
match_bind_flags = +constant_buffer
match_byte_width = 160
filter_index = 3110160
[TextureOverrideLiquidCameraConstants]
match_type = Buffer
match_usage = dynamic
match_bind_flags = +constant_buffer
match_byte_width = 560
filter_index = 3110560
[TextureOverrideLiquidSceneColor]
match_type = Texture2D
match_format = R11G11B10_FLOAT
match_bind_flags = +render_target +shader_resource
match_msaa = 1
filter_index = 3111011
; The main view draws its G-buffer to six render targets; planar reflections
; and shadows draw to fewer.
[ShaderRegexLiquidMainView]
shader_model = vs_4_0 vs_4_1 vs_5_0 vs_5_1
if !$seen && $costume_mods && DRAW_TYPE % 2 == 0 && o5 !== null && od !== null
    if vs-cb2 == 3110160 && vs-cb3 == 3110560
        ResourceCameraSource = copy vs-cb3->Region(vs-cb3->Offset,560)
        ResourceDepth = ref od
        $seen = 1
    endif
endif
; Unity's uber post pass tone maps the HDR scene into a target of the same
; size. Its constants, the slot holding the scene and whether depth is bound
; all differ between shader variants, such as the field's and the character
; screen's, so the pass is the one reading the full-size HDR target into a
; target of another format. Bloom passes write smaller targets, and the final
; blit reads no HDR target.
[ShaderOverrideLiquidTonemap]
hash = 5d95c8f0f24f4940
allow_duplicate_hash = true
if $seen && $enabled && !$drawn && $costume_mods && o0 !== null && o0 != 3111011
    if ps-t0 == 3111011 && ps-t0->Width == o0->Width
        ResourceSceneColor = ref ps-t0
        ps-t0 = null
        run = CommandListInjectWorld
        ps-t0 = ref ResourceSceneColor
    elif ps-t1 == 3111011 && ps-t1->Width == o0->Width
        ResourceSceneColor = ref ps-t1
        ps-t1 = null
        run = CommandListInjectWorld
        ps-t1 = ref ResourceSceneColor
    endif
endif
{{- end}}
