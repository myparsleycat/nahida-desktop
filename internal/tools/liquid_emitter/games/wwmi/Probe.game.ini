; The view constants are at cb1. Unreal does not rewrite a frame's uniform
; buffers once they are bound, so the runtime reads them where they are
; instead of copying them.
[CommandListMainView]
if !$seen && od !== null && rt_width >= 3 && rt_height >= 3 && vs-cb1->Size >= 1280 && vs-cb2->Size >= 256
    ResourceCameraSource = ref vs-cb1
    ResourceDepth = ref od
    $seen = 1
    ; Unreal rewrites these view constants for later views before the
    ; injection, so build the camera while they still hold this one, and
    ; leave the game's compute bindings as they were.
    ResourceMainViewSavedCsCB13 = ref cs-cb13
    ResourceMainViewSavedCsU0 = ref cs-u0
    run = CommandListBuildCamera
    cs-cb13 = ref ResourceMainViewSavedCsCB13
    cs-u0 = ref ResourceMainViewSavedCsU0
    ResourceMainViewSavedCsCB13 = null
    ResourceMainViewSavedCsU0 = null
endif
