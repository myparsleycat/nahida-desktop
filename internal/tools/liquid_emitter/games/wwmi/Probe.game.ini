{{/* WWMI adapter for runtime/Probe.ini; its header names each template. */}}
{{define "mods-enabled"}}$\WWMIv1\enable_mods{{end}}
{{define "root-low"}}-1{{end}}
{{define "root-high"}}2.5{{end}}
{{define "camera-builder"}}camera/UnrealCamera.hlsl{{end}}
{{define "camera-rows" -}}
; The rows of the view constants camera/UnrealCamera.hlsl reads.
x254 = 0
y254 = 70
{{- end}}
{{define "release-view"}}{{end}}
{{define "inject-camera"}}; CommandListMainView built the camera.{{end}}
{{define "end-frame" -}}
; These reference the game's own buffers, which a held reference would keep
; alive after the game releases them.
ResourceCameraSource = null
ResourceDrawCameraSource = null
ResourceSurfaceInstance = null
$main_width = $view_width
$main_height = $view_height
$view_width = 0
$view_height = 0
{{- end}}
{{define "capture-surface" -}}
; The primitive constants at cb2 hold the world root in row 3. Only draws
    ; to a G-buffer the size of the last frame's main view are captured, so the
    ; emitters are placed with the camera the liquid is drawn with.
    if o6 !== null && od !== null && rt_width == $main_width && rt_height == $main_height && vs-cb1 == 3148192 && vs-cb2 == 3141024
        ResourceDrawCameraSource = ref vs-cb1
        $draw_camera = 1
        ResourceSurfaceInstance = ref vs-cb2
        w242 = 3
        $capture = 1
    endif
{{- end}}
{{define "sections" -}}
[Constants]
global $view_width = 0
global $view_height = 0
global $main_width = 0
global $main_height = 0
; Game updates recompile the vertex shaders and change their hashes, so the
; main view is told by its targets and constants instead: every vertex shader
; runs CommandListMainView, as WWMI's own hook does.
[ShaderRegexMainView]
shader_model = vs_4_0 vs_4_1 vs_5_0 vs_5_1
run = CommandListMainView
; Unreal binds its constant buffers without offsets, so vs-cbN->Size is 65536
; for all of them; the buffers' own sizes come through these filter indices.
; Characters bind the view constants, an 8192-byte buffer, at cb1 and their
; 1024-byte primitive constants at cb2; most scenery binds the view constants
; at cb0. No other 8192-byte buffer is bound by the G-buffer draws.
[TextureOverrideLiquidViewConstants]
match_type = Buffer
match_usage = dynamic
match_bind_flags = +constant_buffer
match_byte_width = 8192
filter_index = 3148192
[TextureOverrideLiquidPrimitiveConstants]
match_type = Buffer
match_usage = dynamic
match_bind_flags = +constant_buffer
match_byte_width = 1024
filter_index = 3141024
; Unreal does not rewrite a frame's uniform buffers once they are bound, so
; the runtime reads them where they are instead of copying them.
; Other views, such as a 1024x1024 one, draw characters with the same shaders
; into their own targets, before or after the main view, and at a low render
; resolution may be wider than it. The main view draws its G-buffer to seven
; targets with the swap chain's aspect ratio, which render scaling and
; Unreal's rounding of target sizes keep within 5 percent; the widest such
; view of a frame is taken as the main one. Its size tells the main view's
; draws apart from the next frame on.
[CommandListMainView]
if o6 !== null && od !== null && rt_width > $view_width && rt_height >= 3 && vs-cb1 == 3148192 && vs-cb2 == 3141024
    if rt_width * res_height * 20 < rt_height * res_width * 21 && rt_width * res_height * 21 > rt_height * res_width * 20
        ResourceCameraSource = ref vs-cb1
        ResourceDepth = ref od
        $view_width = rt_width
        $view_height = rt_height
        $seen = 1
        ; Unreal rewrites these view constants for later views before the
        ; injection, so build the camera while they still hold this one, and
        ; leave the game's compute bindings as they were.
        ResourceMainViewSavedCsCB13 = ref cs-cb13
        ResourceMainViewSavedCsU0 = ref cs-u0
        run = CommandListBuildCamera
        cs-cb13 = ref ResourceMainViewSavedCsCB13
        cs-u0 = ref ResourceMainViewSavedCsU0
        ResourceMainViewSavedCsCB13 = null
        ResourceMainViewSavedCsU0 = null
    endif
endif
[ResourceMainViewSavedCsCB13]
[ResourceMainViewSavedCsU0]
; The scene is resolved into the back buffer before the HUD draws over it.
; Some screens skip that resolve, and the first HUD draw into the back buffer
; then marks the same point.
[CommandListInjectBeforeUI]
if $seen && $enabled && !$drawn && $\WWMIv1\enable_mods && $view_width == $main_width && $view_height == $main_height && o0 !== null && o0 === bb
    ResourceSceneColor = ref bb
    run = CommandListInjectWorld
    ; Unreal may resize the swap chain after the scene is resolved and before
    ; Present, and ResizeBuffers fails while the back buffer is referenced.
    ResourceSceneColor = null
endif
[ShaderOverrideSceneResolve]
hash = 7bbc2aca540f6422
allow_duplicate_hash = true
post run = CommandListInjectBeforeUI
[ShaderOverrideHUD_409aa7c153800294]
