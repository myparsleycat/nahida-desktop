{{/* ZZMI adapter for runtime/Probe.ini; its header names each template. */}}
{{define "mods-enabled"}}$costume_mods{{end}}
{{- /* Each part is drawn with its own bone as root; the body's is the pelvis,
about 0.8 m above the feet. */}}
{{define "root-low"}}-1.3{{end}}
{{define "root-high"}}1.2{{end}}
{{define "camera-builder"}}camera/UnityGlobalsCamera.hlsl{{end}}
{{define "camera-rows" -}}
; The rows of a shader's globals camera/UnityGlobalsCamera.hlsl searches.
x254 = 512
{{- end}}
{{define "release-view"}}{{end}}
{{define "end-frame" -}}
$main_width = $view_width
$view_width = 0
{{- end}}
{{define "capture-surface" -}}
; Characters draw the main view's G-buffer with the object constants at cb1,
    ; whose row 3 is the world root of the part drawn, and the camera in the
    ; shader's own globals at cb0. A planar reflection draws them again into
    ; narrower targets and shadows into none, which are skipped. The object
    ; constants grow with what a field lights them with, and
    ; surface/ResolveSurface.hlsl rejects a row 3 that is no root.
    if o3 !== null && o0->Width == $main_width
        ResourceDrawCameraSource = copy vs-cb0
        $draw_camera = 1
        ResourceSurfaceInstance = copy vs-cb1
        w242 = 3
        $capture = 1
    endif
{{- end}}
{{define "sections" -}}
[Constants]
global $view_width = 0
global $main_width = 0
[ResourceSavedTonemapT10]
[ResourceSavedTonemapT12]
; Unity binds whole constant buffers without an offset, for which ->Size
; reports the 65536-byte maximum, so the object constants are told apart by
; their own sizes through this filter index; some fields add rows to them.
[TextureOverrideLiquidObjectConstants]
match_type = Buffer
match_usage = dynamic
match_bind_flags = +constant_buffer
match_byte_width = 464
filter_index = 3120464
[TextureOverrideLiquidObjectConstantsExtended]
match_type = Buffer
match_usage = dynamic
match_bind_flags = +constant_buffer
match_byte_width = 512
filter_index = 3120464
; The main view draws its G-buffer to four targets, as does a planar
; reflection before it into narrower ones, so the widest such view of a frame
; is the main one. Its width tells the main view's draws and tone mapping
; apart from the reflection's from the next frame on.
[ShaderRegexLiquidMainView]
shader_model = vs_4_0 vs_4_1 vs_5_0 vs_5_1
if $costume_mods && DRAW_TYPE % 2 == 0 && o3 !== null && o4 === null && od !== null && vs-cb1 == 3120464
    if o0->Width > $view_width
        ResourceCameraSource = copy vs-cb0
        ResourceDepth = ref od
        $view_width = o0->Width
        $seen = 1
    endif
endif
; Unity's uber post pass tone maps the scene color it reads at ps-t0, the
; main view's HDR target in the field and its lit G-buffer target on the
; character screen. The same vertex shader tone maps the planar reflection
; and builds the color grading table, both narrower. The scene stays bound at
; t12 in the field and t10 on the character screen, which drawing to it unbinds.
[ShaderOverrideLiquidTonemap]
hash = ce43e302fadd1328
allow_duplicate_hash = true
if $seen && $enabled && !$drawn && $costume_mods && $view_width == $main_width && ps-t0 !== null && ps-t0->Width == $main_width
    ResourceSceneColor = ref ps-t0
    ResourceSavedTonemapT10 = ref ps-t10
    ResourceSavedTonemapT12 = ref ps-t12
    ps-t0 = null
    ps-t10 = null
    ps-t12 = null
    run = CommandListInjectWorld
    ps-t0 = ref ResourceSceneColor
    ps-t10 = ref ResourceSavedTonemapT10
    ps-t12 = ref ResourceSavedTonemapT12
    ResourceSavedTonemapT10 = null
    ResourceSavedTonemapT12 = null
endif
{{- end}}
