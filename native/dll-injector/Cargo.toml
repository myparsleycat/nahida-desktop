
[package]
edition = "2021"
name = "dll_injector"
version = "0.1.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.0.0", features = ["napi4"] }
napi-derive = "3.0.0"
libloading = "0.8"
sysinfo = "0.30"
anyhow = "1.0"
injector = { path = "../injector" }

[dependencies.windows]
version = "0.52"
features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
]

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
