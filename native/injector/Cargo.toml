
[package]
authors = ["LongYinan <lynweklm@gmail.com>"]
edition = "2021"
name = "injector"
version = "0.1.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "3.0.0", features = ["napi4"] }
napi-derive = "3.0.0"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_System_Diagnostics_Debug",
    "Win32_Security",
] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
