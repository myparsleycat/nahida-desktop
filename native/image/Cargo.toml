
[package]
authors = ["LongYinan <lynweklm@gmail.com>"]
edition = "2021"
name = "image"
version = "0.1.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = "3.0.0"
napi-derive = "3.0.0"
image = { version = "0.25.9", features = ["default-formats"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
