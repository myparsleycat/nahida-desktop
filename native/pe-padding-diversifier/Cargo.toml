
[package]
name = "pe_padding_diversifier"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Conservative in-place diversification for Windows PE64 DLL padding regions"

[lib]
name = "pe_diversifier"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "pe-diversifier"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
goblin = "0.10.7"
iced-x86 = "1.21.0"
napi = { version = "3.0.0", features = ["async"] }
napi-derive = "3.0.0"
rand_chacha = "0.10.0"
rand_core = "0.10.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
thiserror = "2.0.18"

[build-dependencies]
napi-build = "2"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
strip = "symbols"
