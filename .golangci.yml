version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - intrange
    - misspell
    - nilerr
    - unconvert
  exclusions:
    generated: lax
    paths:
      - ^build/
      - ^frontend/
      - builtin$
      - examples$

formatters:
  # Keep existing lint checks while adopting wrapping incrementally.
  # task fmt / fmt:check and VS Code explicitly enable gofmt,goimports,golines.
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - nahida.live/desktop
    golines:
      max-len: 120
      tab-len: 4
      shorten-comments: false
      reformat-tags: false
  exclusions:
    generated: lax
    paths:
      - ^build/
      - ^frontend/
      - builtin$
      - examples$
