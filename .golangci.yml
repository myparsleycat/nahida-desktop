version: "2"

run:
  timeout: 5m
  tests: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 100

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - exhaustive
    - gocritic
    - godot
    - intrange
    - misspell
    - nilerr
    - nolintlint
    - rowserrcheck
    - sqlclosecheck
    - thelper
    - tparallel
    - unconvert
    - whitespace
  # Left off: revive/wsl_v5 (noisy style), gofumpt (conflicts with golines),
  # goconst/funlen/gocyclo/nestif/paralleltest/modernize/perfsprint (hundreds of
  # existing findings), prealloc (false positives), testifylint (no testify),
  # forcetypeassert/predeclared (large existing-code cleanup).
  settings:
    exhaustive:
      default-signifies-exhaustive: true
    gocritic:
      disabled-checks:
        - ifElseChain
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    generated: lax
    paths:
      - ^build/
      - ^frontend/
      - builtin$
      - examples$
    rules:
      # COM vtable calls in internal/platform convert uintptr to unsafe.Pointer
      # by design, so keep the govet check everywhere else.
      - path: ^internal/platform/
        linters:
          - govet
        text: possible misuse of unsafe\.Pointer

formatters:
  # Keep existing lint checks while adopting wrapping incrementally.
  # task fmt / fmt:check and VS Code explicitly enable gofmt,goimports,golines.
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - nahida.live/desktop
    golines:
      max-len: 120
      tab-len: 4
      shorten-comments: false
      reformat-tags: false
  exclusions:
    generated: lax
    paths:
      - ^build/
      - ^frontend/
      - builtin$
      - examples$
